name: Format player consistency regression test

on:
  push:
    branches:
      - "fix/player-track-consistency"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn
      - run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 600000
      - name: Format regression test
        run: yarn prettier tests/liked-lyric-regression.spec.ts --write
      - name: Commit formatted test and remove staging workflow
        shell: bash
        run: |
          rm .github/workflows/format-player-consistency-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/liked-lyric-regression.spec.ts .github/workflows/format-player-consistency-test.yml
          git commit -m "style: format player consistency regression tests"
          git push origin "HEAD:${GITHUB_REF_NAME}"
