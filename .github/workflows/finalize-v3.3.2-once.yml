name: Finalize v3.3.2 Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-v3.3.2-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies without scripts
        run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 600000

      - name: Align updater, regression tests, and README with the three-package release contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          updater_path = Path('src/main/checkUpdate.ts')
          updater = updater_path.read_text()
          old_updater = '''/**
           * 判断当前安装格式是否支持 electron-updater 原生下载安装。
           *
           * 详细说明：
           * 1. Windows 安装包继续使用 electron-updater；
           * 2. Linux 只有 AppImage 存在 APPIMAGE 环境变量时才调用 electron-updater；
           * 3. Linux Deb、源码开发环境和未签名 macOS 构建仅检查 GitHub Release，下载时打开发布页；
           * 4. 这样可以避免非 AppImage 环境反复输出 APPIMAGE env is not defined。
           */
          const canUseNativeUpdater = () => {
            if (!app.isPackaged || Constants.IS_MAC) return false
            if (Constants.IS_LINUX) return Boolean(process.env.APPIMAGE)
            if (isWindowsPortable()) return false
            return true
          }
          '''
          new_updater = '''/**
           * v3.3.2 起正式 Release 只发布 Windows x64 EXE、Linux amd64 DEB 和 macOS arm64 DMG。
           * Release 不再附带 electron-updater 所需的 latest*.yml / blockmap，因此所有正式安装格式
           * 都统一走 GitHub Release 只读检查，并在用户主动确认后打开发布页完成系统安装器升级。
           */
          const canUseNativeUpdater = () => false
          '''
          if old_updater not in updater:
              raise SystemExit('expected updater capability block not found')
          updater_path.write_text(updater.replace(old_updater, new_updater, 1))

          test_path = Path('tests/feature-regression.spec.ts')
          tests = test_path.read_text()
          old_test = '''    expect(updater).toContain('PORTABLE_EXECUTABLE_FILE')
              expect(updater).toContain("process.arch === 'arm64' ? 'latest-win-arm64' : 'latest-win-x64'")

              const releaseWorkflow = readSource('.github/workflows/build.yml')
              expect(releaseWorkflow).toContain('upload/latest-win-x64.yml')
              expect(releaseWorkflow).toContain('upload/latest-win-arm64.yml')
              expect(releaseWorkflow).toContain('upload/latest.yml')
          '''
          new_test = '''    expect(updater).toContain('PORTABLE_EXECUTABLE_FILE')
              expect(updater).toContain('const canUseNativeUpdater = () => false')

              const releaseWorkflow = readSource('.github/workflows/build.yml')
              expect(releaseWorkflow).toContain('release/*/VutronMusic*_win_x64.exe')
              expect(releaseWorkflow).toContain('release/*/VutronMusic*_linux_amd64.deb')
              expect(releaseWorkflow).toContain('release/*/VutronMusic*_mac_arm64.dmg')
              expect(releaseWorkflow).toContain('yarn build --x64 -p never --win nsis')
              expect(releaseWorkflow).toContain('yarn build --x64 -p never --linux deb')
              expect(releaseWorkflow).toContain('yarn build --arm64 -p never --mac dmg')
              expect(releaseWorkflow).toContain('Collect exactly three release assets')
              expect(releaseWorkflow).toContain('test "${count}" = "3"')
              expect(releaseWorkflow).not.toContain('latest-win-x64.yml')
              expect(releaseWorkflow).not.toContain('latest-win-arm64.yml')
              expect(releaseWorkflow).not.toContain('--win nsis portable')
          '''
          if old_test not in tests:
              raise SystemExit('expected updater regression block not found')
          test_path.write_text(tests.replace(old_test, new_test, 1))

          readme_path = Path('README.md')
          readme = readme_path.read_text()
          old_version = '**当前正式版本：[`v3.3.1`](https://github.com/bysanhz/VutronMusic_Custom4Mac-Linux/releases/tag/v3.3.1)**（2026-09-07）。'
          new_version = '**当前正式版本：[`v3.3.2`](https://github.com/bysanhz/VutronMusic_Custom4Mac-Linux/releases/tag/v3.3.2)**（2026-09-11）。'
          if old_version not in readme:
              raise SystemExit('expected README current-version line not found')
          readme = readme.replace(old_version, new_version, 1)

          old_table = '''| 平台 | 架构 | 安装包 | 更新方式 |
          | --- | --- | --- | --- |
          | Linux | x86_64 | AppImage / Deb / RPM / Snap | AppImage 支持应用内更新；其他格式跳转 Release |
          | Linux | ARM64 | AppImage / Deb / RPM | 应用内检查版本，跳转 Release 手动下载 |
          | macOS | Apple Silicon | 本机源码构建（推荐）/ 未签名 DMG arm64 | 应用内检查版本，跳转 Release |
          | macOS | Intel | 本机源码构建（推荐）/ 未签名 DMG x64 | 应用内检查版本，跳转 Release |
          | Windows | x64 | 安装版 / Portable | 安装版支持应用内更新；Portable 跳转 Release 手动下载 |
          | Windows | ARM64 | 安装版 | 支持应用内更新 |
          '''
          new_table = '''| 平台 | 架构 | 正式 Release 安装包 | 更新方式 |
          | --- | --- | --- | --- |
          | Windows | x64 | `VutronMusic-*_win_x64.exe` | 应用内主动检查版本，跳转 Release 手动下载安装 |
          | Linux | x86_64 / amd64 | `VutronMusic-*_linux_amd64.deb` | 应用内主动检查版本，跳转 Release 手动下载安装 |
          | macOS | Apple Silicon / arm64 | `VutronMusic-*_mac_arm64.dmg` | 应用内主动检查版本，跳转 Release 手动下载安装 |
          '''
          if old_table not in readme:
              raise SystemExit('expected README platform table not found')
          readme = readme.replace(old_table, new_table, 1)

          marker = '### v3.3.1 稳定性更新\n'
          section = '''### v3.3.2 桌面歌词与跨平台稳定性更新

          - 修复 Windows 锁定桌面歌词后鼠标穿透自动隐藏无法可靠恢复的问题；
          - 统一桌面歌词底部锁定 / 解锁入口，并继续优化拖动、拉伸命中区与底部拖动 Bar 的视觉干扰；
          - 修复逐字歌词第一词闪烁和时间轴零点不一致导致的系统性提前问题；
          - 修复 Windows 主窗口隐藏时托盘菜单无法正常打开的问题；
          - 修复 Linux 托盘菜单递归导致的主进程栈溢出及后续桌面歌词 / IPC 初始化失败；
          - 正式 Release 从本版本起固定只发布 Windows x64 EXE、Linux amd64 DEB、macOS arm64 DMG 三个安装包；应用内更新改为用户主动检查后跳转 Release 手动安装。

          完整版本说明见 [`v3.3.2 Release`](https://github.com/bysanhz/VutronMusic_Custom4Mac-Linux/releases/tag/v3.3.2)。

          '''
          if marker not in readme:
              raise SystemExit('expected README v3.3.1 marker not found')
          if '### v3.3.2 桌面歌词与跨平台稳定性更新' not in readme:
              readme = readme.replace(marker, section + marker, 1)

          old_mac = '''先根据 Mac 架构选择正确的安装包：

          - Apple Silicon（M1/M2/M3/M4/M5 等）下载 `arm64` DMG；
          - Intel Mac 下载 `x64` DMG。'''
          new_mac = '''当前正式 Release 仅提供 Apple Silicon（M1/M2/M3/M4/M5 等）的 `arm64` DMG。Intel Mac 暂不提供预构建 DMG，可继续按本文“macOS 本机构建”说明从源码构建。'''
          if old_mac not in readme:
              raise SystemExit('expected README Mac architecture paragraph not found')
          readme_path.write_text(readme.replace(old_mac, new_mac, 1))
          PY

      - name: Format modified source and docs
        run: yarn prettier src/main/checkUpdate.ts tests/feature-regression.spec.ts README.md --write

      - name: Commit finalized v3.3.2 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/checkUpdate.ts tests/feature-regression.spec.ts README.md
          git commit -m "chore: finalize v3.3.2 release source"
          git push origin HEAD:main
