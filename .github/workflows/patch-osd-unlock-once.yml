name: One-time patch unified desktop lyric unlock

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-osd-unlock-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn

      - name: Apply lock and unlock patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch-osd-unlock.py
          python /tmp/patch-osd-unlock.py

      - name: Install dependencies
        env:
          SKIP_REBUILD: true
        run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 600000

      - name: Format changed files
        run: yarn prettier src/renderer/views/OSDLyric.vue src/preload/osdWin.ts src/renderer/assets/icons/unlock.svg tests/osd-bottom-lock.spec.ts --write

      - name: Commit patch and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/views/OSDLyric.vue src/preload/osdWin.ts src/renderer/assets/icons/unlock.svg tests/osd-bottom-lock.spec.ts
          git rm .github/workflows/patch-osd-unlock-once.yml
          git commit -m "feat: unify desktop lyric lock and unlock controls"
          git push origin HEAD:main
