name: One-time v3.3.0 app icon validation

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/validate-v3.3.0-icon-once.yml'
      - 'buildAssets/icon-source/**'
      - 'tools/generate-app-icons.js'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies without native rebuild
        run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 600000

      - name: Generate and validate app icons
        shell: bash
        run: |
          set -euo pipefail
          node tools/generate-app-icons.js
          node - <<'NODE'
          const sharp = require('sharp')

          ;(async () => {
            const checks = [
              ['buildAssets/generated-icons/1024x1024.png', 1024, 1024],
              ['buildAssets/generated-icons/linux/512x512.png', 512, 512],
              ['buildAssets/generated-icons/tray/24x24.png', 24, 24]
            ]

            for (const [path, width, height] of checks) {
              const meta = await sharp(path).metadata()
              if (meta.format !== 'png' || meta.width !== width || meta.height !== height) {
                throw new Error(
                  `${path}: expected PNG ${width}x${height}, got ${meta.format} ${meta.width}x${meta.height}`
                )
              }
              console.log(`${path}: ${meta.format} ${meta.width}x${meta.height}`)
            }
          })().catch((error) => {
            console.error(error)
            process.exit(1)
          })
          NODE

      - name: Remove one-time validation workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-v3.3.0-icon-once.yml
          git commit -m "chore: remove one-time v3.3.0 icon validator"
          git push origin HEAD:main
