name: Promote v3.2.10 once

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: write

jobs:
  promote:
    if: github.repository == 'bysanhz/VutronMusic_Custom4Mac-Linux' && github.head_ref == 'automation/trigger-v3.2.10-promote'
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: 632e474a2f978641fc909711f0359c1acdf4300e
      RELEASE_TAG: v3.2.10
      RELEASE_RUN_ID: '32111934680'
      RELEASE_ID: '372171859'
      STATUS_BRANCH: automation/v3.2.10-release-status
      STATUS_FILE: .release-v3.2.10-status.txt
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify build, tag and draft assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN_ID}")"
          test "$(jq -r '.status' <<<"${RUN}")" = 'completed'
          test "$(jq -r '.conclusion' <<<"${RUN}")" = 'success'
          test "$(jq -r '.head_sha' <<<"${RUN}")" = "${TARGET_SHA}"

          REMOTE_TAG="$(git ls-remote origin "refs/tags/${RELEASE_TAG}" | awk '{print $1}')"
          test "${REMOTE_TAG}" = "${TARGET_SHA}"

          RELEASE="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
          test "$(jq -r '.draft' <<<"${RELEASE}")" = 'true'
          test "$(jq -r '.prerelease' <<<"${RELEASE}")" = 'false'

          ASSETS="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100")"
          NAMES="$(jq -r '.[].name' <<<"${ASSETS}")"
          printf '%s\n' "${NAMES}"
          grep -Fxq 'VutronMusic-3.2.10_mac_arm64.dmg' <<<"${NAMES}"
          grep -Fxq 'VutronMusic-3.2.10_mac_x64.dmg' <<<"${NAMES}"
          grep -Fxq 'VutronMusic-3.2.10_win_x64.exe' <<<"${NAMES}"
          grep -Fxq 'VutronMusic-3.2.10_win_x64-Portable.exe' <<<"${NAMES}"
          grep -Fxq 'VutronMusic-3.2.10_win_arm64.exe' <<<"${NAMES}"
          grep -Fxq 'VutronMusic-3.2.10_linux_x86_64.AppImage' <<<"${NAMES}"
          grep -Fxq 'VutronMusic-3.2.10_linux_arm64.AppImage' <<<"${NAMES}"
          grep -Fxq 'VutronMusic-3.2.10_linux_amd64.deb' <<<"${NAMES}"
          grep -Fxq 'VutronMusic-3.2.10_linux_arm64.deb' <<<"${NAMES}"
          grep -Fxq 'VutronMusic-3.2.10_linux_x86_64.rpm' <<<"${NAMES}"
          grep -Fxq 'VutronMusic-3.2.10_linux_aarch64.rpm' <<<"${NAMES}"
          grep -Fxq 'VutronMusic-3.2.10_linux_amd64.snap' <<<"${NAMES}"
          grep -Fxq 'latest.yml' <<<"${NAMES}"
          grep -Fxq 'latest-mac.yml' <<<"${NAMES}"
          grep -Fxq 'latest-linux.yml' <<<"${NAMES}"
          grep -Fxq 'latest-linux-arm64.yml' <<<"${NAMES}"

      - name: Promote same draft to v3.2.10 Latest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git show "${TARGET_SHA}:.github/release-notes/v3.2.10.md" > /tmp/v3.2.10-notes.md
          jq -n \
            --arg tag "${RELEASE_TAG}" \
            --arg name 'VutronMusic v3.2.10' \
            --rawfile body /tmp/v3.2.10-notes.md \
            '{tag_name:$tag,name:$name,body:$body,draft:false,prerelease:false,make_latest:"true"}' \
            > /tmp/v3.2.10-release.json
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            --input /tmp/v3.2.10-release.json >/dev/null

      - name: Verify formal release terminal state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          FORMAL="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          test "$(jq -r '.id' <<<"${FORMAL}")" = "${RELEASE_ID}"
          test "$(jq -r '.draft' <<<"${FORMAL}")" = 'false'
          test "$(jq -r '.prerelease' <<<"${FORMAL}")" = 'false'
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.id')" = "${RELEASE_ID}"
          test "$(git ls-remote origin "refs/tags/${RELEASE_TAG}" | awk '{print $1}')" = "${TARGET_SHA}"

      - name: Publish final status snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf /tmp/vutron-v3210-final
          git worktree add -B "${STATUS_BRANCH}" /tmp/vutron-v3210-final "${TARGET_SHA}"
          {
            printf 'tag=%s\n' "${RELEASE_TAG}"
            printf 'target_sha=%s\n' "${TARGET_SHA}"
            printf 'run_id=%s\n' "${RELEASE_RUN_ID}"
            printf 'status=success\n'
            printf 'release_id=%s\n' "${RELEASE_ID}"
            printf 'latest=true\n'
          } > "/tmp/vutron-v3210-final/${STATUS_FILE}"
          cd /tmp/vutron-v3210-final
          git add "${STATUS_FILE}"
          git commit -m 'chore: record successful v3.2.10 release'
          git push --force origin "HEAD:refs/heads/${STATUS_BRANCH}"
