name: Direct audit diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/direct-audit-diagnostic.yml'
      - '.github/workflows/global-audit-fix.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract reviewed fix script
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/global-audit-fix.yml').read_text(encoding='utf-8')
          start_marker = "python3 <<'PY'\n"
          end_marker = "\n          PY\n"
          yaml_indent = '          '

          start = source.find(start_marker)
          if start < 0:
              raise SystemExit('未找到全局审查修复脚本起始标记')
          start += len(start_marker)

          end = source.find(end_marker, start)
          if end < 0:
              raise SystemExit('未找到全局审查修复脚本结束标记')

          script_lines = [
              line[len(yaml_indent):] if line.startswith(yaml_indent) else line
              for line in source[start:end].splitlines()
          ]
          script = '\n'.join(script_lines) + '\n'
          target = Path('/tmp/apply_global_audit_fixes.py')
          compile(script, str(target), 'exec')
          target.write_text(script, encoding='utf-8')
          print(f'Extracted {len(script_lines)} lines')
          PY

      - name: Capture exact apply error
        run: |
          set +e
          python3 /tmp/apply_global_audit_fixes.py > .github/audit-error.log 2>&1
          status=$?
          printf '\nexit_code=%s\n' "$status" >> .github/audit-error.log
          cat .github/audit-error.log
          exit 0

      - name: Commit diagnostic output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/audit-error.log
          git commit -m "记录全局审查修复失败位置" || exit 0
          git push origin HEAD:main
