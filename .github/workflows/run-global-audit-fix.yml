name: Run global audit fixes

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  audit-fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies without native rebuild
        run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 600000

      - name: Extract reviewed fix script
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('.github/workflows/global-audit-fix.yml')
          source = source_path.read_text(encoding='utf-8')

          start_marker = "python3 <<'PY'\n"
          end_marker = "\n          PY\n"
          yaml_indent = '          '

          start = source.find(start_marker)
          if start < 0:
              raise SystemExit('未找到全局审查修复脚本起始标记')

          start += len(start_marker)
          end = source.find(end_marker, start)
          if end < 0:
              raise SystemExit('未找到全局审查修复脚本结束标记')

          raw_lines = source[start:end].splitlines()
          script_lines = []
          for line in raw_lines:
              if line.startswith(yaml_indent):
                  script_lines.append(line[len(yaml_indent):])
              else:
                  script_lines.append(line)

          script = '\n'.join(script_lines) + '\n'
          target = Path('/tmp/apply_global_audit_fixes.py')

          try:
              compile(script, str(target), 'exec')
          except SyntaxError as error:
              raise SystemExit(f'提取后的修复脚本语法检查失败：{error}') from error

          target.write_text(script, encoding='utf-8')
          print(f'Extracted {len(script_lines)} script lines to {target}')
          PY

      - name: Apply reviewed global fixes
        run: python3 /tmp/apply_global_audit_fixes.py

      - name: Format changed files
        run: |
          yarn prettier --write \
            package.json \
            README.md \
            .github/workflows/build-macos.yml \
            src/renderer/main.ts \
            src/renderer/store/player.ts \
            src/renderer/store/osdLyric.ts \
            src/renderer/components/LyricPage.vue \
            src/renderer/components/OsdLyricContainer.vue \
            src/renderer/components/ScrollBar.vue \
            src/renderer/components/NavBar.vue \
            src/renderer/views/PlayPage.vue \
            src/renderer/views/OSDLyric.vue \
            src/renderer/views/LocalMusic.vue \
            src/renderer/App.vue \
            src/renderer/utils/globalLyricOffset.ts \
            src/renderer/utils/smoothWindowScale.ts \
            src/renderer/utils/smoothOsdWindowScale.ts

      - name: Audit targeted legacy patterns
        run: |
          echo 'Direct track offset references:'
          rg -n "currentTrack.*offset|currentTrack\.value.*offset" src/renderer || true

          echo 'Deprecated workflow action majors:'
          if rg -n "actions/setup-node@v4|actions/upload-artifact@v4" .github/workflows; then
            echo 'Deprecated action major remains.' >&2
            exit 1
          fi

          echo 'Stale destructive build documentation:'
          if rg -n "build:pre.*prettier|Prettier 格式化" README.md; then
            echo 'README still documents destructive build formatting.' >&2
            exit 1
          fi

          grep -F '@click="setOffset(+0.5, $event)"' src/renderer/components/LyricPage.vue
          grep -F '@click="setOffset(-0.5, $event)"' src/renderer/components/LyricPage.vue
          grep -F "return resolve('')" src/renderer/store/player.ts

      - name: Lint
        run: yarn lint

      - name: Type check
        run: yarn vue-tsc --noEmit

      - name: Build renderer and main process
        run: yarn vite build

      - name: Commit reviewed fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm \
            .github/workflows/global-audit-fix.yml \
            .github/workflows/run-global-audit-fix.yml

          git add \
            package.json \
            README.md \
            .github/workflows/build-macos.yml \
            src/renderer/main.ts \
            src/renderer/store/player.ts \
            src/renderer/store/osdLyric.ts \
            src/renderer/components/LyricPage.vue \
            src/renderer/components/OsdLyricContainer.vue \
            src/renderer/components/ScrollBar.vue \
            src/renderer/components/NavBar.vue \
            src/renderer/views/PlayPage.vue \
            src/renderer/views/OSDLyric.vue \
            src/renderer/views/LocalMusic.vue \
            src/renderer/App.vue \
            src/renderer/utils/globalLyricOffset.ts \
            src/renderer/utils/smoothWindowScale.ts \
            src/renderer/utils/smoothOsdWindowScale.ts

          git commit -m "修复全局审查发现的播放器与跨窗口遗留问题"
          git push origin HEAD:main