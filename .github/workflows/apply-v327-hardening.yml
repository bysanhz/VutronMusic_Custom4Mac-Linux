name: Apply v3.2.7 Hardening

on:
  push:
    branches:
      - main
    paths:
      - '.github/hardening-trigger'

permissions:
  contents: write

concurrency:
  group: apply-v327-hardening
  cancel-in-progress: true

env:
  RESULT_BRANCH: automation/v327-hardening-result

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure automation identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare result branch
        run: |
          git switch -C "$RESULT_BRANCH"
          printf 'workflow-started=%s\nsource=%s\n' "$(date -u +%FT%TZ)" "$GITHUB_SHA" > .github/hardening-result.txt
          rm -f .github/hardening-apply.txt
          git add -A
          git commit -m "记录 v3.2.7 加固工作流启动"
          git push --force origin "HEAD:$RESULT_BRANCH"

      - name: Reconstruct and apply patch
        shell: bash
        run: |
          set +e
          cat .github/hardening-payload/part*.txt > /tmp/hardening.b64
          python3 -c "import base64,gzip,pathlib; p=pathlib.Path('/tmp/hardening.b64').read_text().strip(); s=gzip.decompress(base64.b64decode(p)); target=pathlib.Path('.github/apply-v327-hardening.py'); target.write_bytes(s); compile(s, str(target), 'exec')" > .github/hardening-apply.txt 2>&1
          decode_status=$?
          if [ "$decode_status" -eq 0 ]; then
            timeout 60s python3 .github/apply-v327-hardening.py >> .github/hardening-apply.txt 2>&1
            apply_status=$?
          else
            apply_status=$decode_status
          fi
          rm -f .github/apply-v327-hardening.py
          printf '\nexit_status=%s\n' "$apply_status" >> .github/hardening-apply.txt
          cat .github/hardening-apply.txt
          git add -f .github/hardening-apply.txt
          git add -A
          git commit -m "记录 v3.2.7 加固补丁执行结果" || true
          git push --force origin "HEAD:$RESULT_BRANCH"
          exit "$apply_status"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies without native rebuild
        run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 600000

      - name: Format generated changes
        run: yarn run format:fix

      - name: Publish generated source for review
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "生成 v3.2.7 安全性与交互稳定性修复"
            git push --force origin "HEAD:$RESULT_BRANCH"
          fi

      - name: Validate code quality
        run: |
          yarn run format:check
          yarn lint
          yarn run vue:type-check
          yarn playwright test tests/security-hardening.spec.ts
          yarn vite --config vite.config.ts build

      - name: Promote validated changes to main
        run: |
          git commit --allow-empty -m "修复 v3.2.7 安全性与交互稳定性问题"
          git push origin HEAD:main
