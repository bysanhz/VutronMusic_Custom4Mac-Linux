name: One-time update OSD unlock regression

# Retry after fixing updater-script quoting.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-osd-unlock-regression-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn

      - name: Update regression
        run: python .github/scripts/update-osd-unlock-regression.py

      - name: Install dependencies
        env:
          SKIP_REBUILD: true
        run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 600000

      - name: Format regression
        run: yarn prettier tests/feature-regression.spec.ts --write

      - name: Commit regression update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/feature-regression.spec.ts
          git commit -m "test: cover unified desktop lyric unlock behavior"
          git push origin HEAD:main
