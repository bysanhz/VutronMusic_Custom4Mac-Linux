name: Fix protocol registration timing

on:
  push:
    branches:
      - main
    paths:
      - '.github/protocol-ready-trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Patch protocol registration timing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/main/index.ts')
          source = path.read_text()
          old = """  handleAppEvents() {
    this.handleProtocol()
    app.whenReady().then(async () => {
      this.createMainWindow().then(() => {
"""
          new = """  handleAppEvents() {
    app.whenReady().then(async () => {
      // protocol.handle() accesses Electron's default session and must only run after app readiness.
      this.handleProtocol()

      this.createMainWindow().then(() => {
"""
          count = source.count(old)
          if count != 1:
              raise RuntimeError(f'Expected one protocol timing block, found {count}')
          path.write_text(source.replace(old, new))
          PY

          rm -f .github/protocol-ready-trigger
          rm -f .github/workflows/fix-protocol-ready.yml

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies without native rebuild
        run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 600000

      - name: Format and validate
        run: |
          yarn prettier src/main/index.ts --write
          yarn run format:check
          yarn lint
          yarn run vue:type-check
          yarn playwright test tests/security-hardening.spec.ts
          yarn vite --config vite.config.ts build

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "修复 Electron 就绪前注册协议导致的启动卡死"
          git push origin HEAD:main
