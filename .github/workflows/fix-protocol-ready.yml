name: Fix protocol registration timing

on:
  push:
    branches:
      - main
    paths:
      - .github/protocol-ready-trigger

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Patch protocol registration timing
        shell: bash
        run: >-
          python3 -c "from pathlib import Path; p=Path('src/main/index.ts'); s=p.read_text(); old='  handleAppEvents() {\n    this.handleProtocol()\n    app.whenReady().then(async () => {\n      this.createMainWindow().then(() => {\n'; new='  handleAppEvents() {\n    app.whenReady().then(async () => {\n      // protocol.handle() accesses the Electron default session and must run after app readiness.\n      this.handleProtocol()\n\n      this.createMainWindow().then(() => {\n'; count=s.count(old); assert count == 1, f'Expected one protocol timing block, found {count}'; p.write_text(s.replace(old, new))"

      - name: Remove temporary workflow files
        run: rm -f .github/protocol-ready-trigger .github/workflows/fix-protocol-ready.yml

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies without native rebuild
        run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 600000

      - name: Format and validate
        run: |
          yarn prettier src/main/index.ts --write
          yarn run format:check
          yarn lint
          yarn run vue:type-check
          yarn playwright test tests/security-hardening.spec.ts
          yarn vite --config vite.config.ts build

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "修复 Electron 就绪前注册协议导致的启动卡死"
          git push origin HEAD:main
