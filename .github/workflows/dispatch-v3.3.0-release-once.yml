name: One-time VutronMusic v3.3.0 release dispatcher

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/dispatch-v3.3.0-release-once.yml'

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6

      - name: Dispatch formal v3.3.0 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body             --request POST             --header "Accept: application/vnd.github+json"             --header "Authorization: Bearer ${GH_TOKEN}"             --header "X-GitHub-Api-Version: 2022-11-28"             https://api.github.com/repos/bysanhz/VutronMusic_Custom4Mac-Linux/actions/workflows/build.yml/dispatches             --data '{"ref":"v3.3.0","inputs":{"release_tag":"v3.3.0"}}'

      - name: Remove one-time dispatcher
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dispatch-v3.3.0-release-once.yml
          git commit -m "chore: remove one-time v3.3.0 release dispatcher"
          git push origin HEAD:main
