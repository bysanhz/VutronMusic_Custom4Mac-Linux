name: One-time Heart Mode release formatting

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/format-release-prep-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 600000

      - name: Format CI-blocking files
        shell: bash
        run: |
          ./node_modules/.bin/prettier --write             src/renderer/components/HeartModeAssistant.vue             src/renderer/main.ts             src/renderer/utils/heartModeEngine.ts             src/renderer/utils/heartModeHistory.ts             src/renderer/utils/heartModeProfile.ts             src/renderer/utils/heartModeReranker.ts             src/renderer/utils/heartModeScorer.ts             src/renderer/utils/heartModeSession.ts             src/renderer/utils/playbackFeedback.ts             src/renderer/views/SystemSettings.vue             tests/feature-regression.spec.ts
          git diff --check

      - name: Commit formatted sources and remove this workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             src/renderer/components/HeartModeAssistant.vue             src/renderer/main.ts             src/renderer/utils/heartModeEngine.ts             src/renderer/utils/heartModeHistory.ts             src/renderer/utils/heartModeProfile.ts             src/renderer/utils/heartModeReranker.ts             src/renderer/utils/heartModeScorer.ts             src/renderer/utils/heartModeSession.ts             src/renderer/utils/playbackFeedback.ts             src/renderer/views/SystemSettings.vue             tests/feature-regression.spec.ts
          git rm .github/workflows/format-release-prep-once.yml
          git commit -m "chore: format heart-mode release sources"
          git push origin HEAD:main
