name: Fix track load network once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-track-load-network-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies without native rebuild
        run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 600000

      - name: Apply repair
        run: python .github/scripts/fix_track_load_network.py

      - name: Format changed files
        run: |
          yarn prettier src/renderer/store/player.ts src/main/index.ts src/main/appServer/netease.ts tests/player-track-state-race.spec.ts --write
          git diff --check

      - name: Type check
        run: yarn run vue:type-check

      - name: Run regression tests
        run: yarn playwright test tests/player-track-state-race.spec.ts

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/store/player.ts src/main/index.ts src/main/appServer/netease.ts tests/player-track-state-race.spec.ts
          git commit -m "fix: make track loading resilient to API network failures"
          git push origin HEAD:main
