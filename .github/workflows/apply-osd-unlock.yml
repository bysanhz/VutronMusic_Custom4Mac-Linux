name: Apply desktop lyric unlock

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-osd-unlock.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn

      - name: Apply source patch
        run: python .github/scripts/apply-osd-unlock.py

      - name: Install dependencies
        env:
          SKIP_REBUILD: true
        run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 600000

      - name: Format changed text sources
        run: yarn prettier src/renderer/views/OSDLyric.vue src/preload/osdWin.ts tests/osd-bottom-lock.spec.ts --write

      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/views/OSDLyric.vue src/preload/osdWin.ts src/renderer/assets/icons/unlock.svg tests/osd-bottom-lock.spec.ts
          git commit -m "feat: unify desktop lyric lock and unlock controls"
          git push origin HEAD:main
