name: One-time VutronMusic v3.3.0 publisher

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v3.3.0-once.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main with full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify and create v3.3.0 tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          TARGET_SHA="$(git rev-parse HEAD^)"
          PACKAGE_VERSION="$(
            git show "${TARGET_SHA}:package.json" |
              node -e 'let s=""; process.stdin.on("data", d => s += d).on("end", () => console.log(JSON.parse(s).version))'
          )"

          echo "Release source: ${TARGET_SHA}"
          echo "package.json version: ${PACKAGE_VERSION}"
          test "${PACKAGE_VERSION}" = "3.3.0"
          git cat-file -e "${TARGET_SHA}:.github/release-notes/v3.3.0.md"

          if git rev-parse -q --verify "refs/tags/v3.3.0" >/dev/null; then
            echo "v3.3.0 tag already exists"
            exit 1
          fi

          git tag -a v3.3.0 "${TARGET_SHA}" -m "VutronMusic v3.3.0"
          git push origin v3.3.0

      - name: Remove one-time publisher
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/publish-v3.3.0-once.yml
          git commit -m "chore: remove one-time v3.3.0 publisher"
          git push origin HEAD:main
