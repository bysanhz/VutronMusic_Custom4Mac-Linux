name: One-time v3.3.1 publisher

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v3.3.1-once.yml'

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve validated release source
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SHA="$(git rev-parse HEAD^)"
          echo "TARGET_SHA=${TARGET_SHA}" >> "$GITHUB_ENV"
          echo "Validated release source: ${TARGET_SHA}"

      - name: Verify v3.3.1 release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git show "${TARGET_SHA}:package.json" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>process.stdout.write(JSON.parse(s).version))")" = "3.3.1"
          git cat-file -e "${TARGET_SHA}:.github/release-notes/v3.3.1.md"
          git cat-file -e "${TARGET_SHA}:README.md"

      - name: Create and push annotated release tag
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/v3.3.1" >/dev/null; then
            echo "v3.3.1 already exists; refusing to move it."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v3.3.1 "${TARGET_SHA}" -m "VutronMusic v3.3.1"
          git push origin refs/tags/v3.3.1

      - name: Dispatch formal Release workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${GH_TOKEN}"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/dispatches"             -d '{"ref":"v3.3.1","inputs":{"release_tag":"v3.3.1"}}'

      - name: Remove one-time publisher
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/publish-v3.3.1-once.yml
          git commit -m "chore: remove one-time v3.3.1 publisher"
          git push origin HEAD:main
