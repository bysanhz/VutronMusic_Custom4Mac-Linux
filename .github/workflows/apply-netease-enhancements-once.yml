name: Apply NetEase Enhancements Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-netease-enhancements-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply source patches
        run: python tools/apply-netease-enhancements-once.py

      - name: Commit source patches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/components/NavBar.vue src/renderer/components/VirtualTrackList.vue src/renderer/store/data.ts src/renderer/store/settings.ts src/renderer/views/SystemSettings.vue src/main/utils/index.ts
          git commit -m "feat: integrate modern NetEase discovery and playback APIs"
          git push origin HEAD:main
