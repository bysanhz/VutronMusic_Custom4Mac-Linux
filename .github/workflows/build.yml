name: Release

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
    paths:
      - '.github/beta-release.json'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional existing vX.Y.Z tag to publish as a formal release'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn

      - name: Verify release tag matches package version
        if: (github.event_name == 'push' && github.ref_type == 'tag') || inputs.release_tag != ''
        shell: bash
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ -n "${RELEASE_TAG_INPUT}" ]]; then
            TAG_NAME="${RELEASE_TAG_INPUT}"
          fi
          [[ "${TAG_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          TAG_VERSION="${TAG_NAME#v}"
          echo "package.json version: ${PACKAGE_VERSION}"
          echo "release tag version: ${TAG_VERSION}"
          test "${PACKAGE_VERSION}" = "${TAG_VERSION}"

      - name: Verify beta release manifest and version
        if: github.event_name == 'push' && github.ref_type == 'branch'
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs')
          const version = require('./package.json').version
          const manifest = JSON.parse(fs.readFileSync('.github/beta-release.json', 'utf8'))
          if (!/^\d+\.\d+\.\d+-beta\.\d+$/.test(version)) {
            throw new Error('Beta builds must use a semver beta version')
          }
          if (manifest.version !== version) {
            throw new Error('Beta trigger must match package.json version')
          }
          const notes = `.github/release-notes/v${version}.md`
          if (!fs.existsSync(notes)) throw new Error(`Missing release notes: ${notes}`)
          console.log(`Verified Beta release v${version}`)
          NODE

      - name: Install dependencies without native rebuild
        run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 600000

      - name: Check formatting
        if: (github.event_name == 'push' && github.ref_type == 'tag') || github.event_name == 'workflow_dispatch'
        run: yarn run format:check

      - name: Lint source
        run: yarn lint

      - name: Type check
        run: yarn run vue:type-check

      - name: Run security and feature regression tests
        if: (github.event_name == 'push' && github.ref_type == 'tag') || github.event_name == 'workflow_dispatch'
        run: >-
          yarn playwright test tests/security-hardening.spec.ts tests/feature-regression.spec.ts

      # Beta verification stays strict on security and build, while the current
      # known formatting and feature-test baseline remains visible in CI.
      - name: Run beta security and playback lifecycle tests
        if: github.event_name == 'push' && github.ref_type == 'branch'
        run: >-
          yarn playwright test tests/security-hardening.spec.ts tests/netease-scrobble-lifecycle.spec.ts

      - name: Build renderer and main process
        run: yarn vite --config vite.config.ts build

  package:
    name: Release ${{ matrix.label }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win32
            arch: x64
            label: Windows x64 EXE
            artifact: VutronMusic-release-win-x64
            output: release/*/VutronMusic*_win_x64.exe
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            label: Linux amd64 DEB
            artifact: VutronMusic-release-linux-amd64-deb
            output: release/*/VutronMusic*_linux_amd64.deb
          - os: macos-14
            platform: darwin
            arch: arm64
            label: macOS arm64 DMG
            artifact: VutronMusic-release-mac-arm64-dmg
            output: release/*/VutronMusic*_mac_arm64.dmg

    runs-on: ${{ matrix.os }}
    env:
      XVFB_PFX: ${{ (matrix.platform == 'linux' && 'xvfb-run --auto-servernum -- ') || '' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn

      - name: Install Linux DEB build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot libnss3-dev libgtk-3-dev libxss-dev libgconf-2-4 libasound2

      - name: Install dependencies
        env:
          SKIP_REBUILD: true
        run: ${{ env.XVFB_PFX }}yarn install --frozen-lockfile --network-timeout 600000

      - name: Fix taglib-wasm
        run: ${{ env.XVFB_PFX }}npm run fix-taglib

      - name: Rebuild native dependencies
        shell: bash
        run: |
          ${{ env.XVFB_PFX }}npm rebuild
          ${{ env.XVFB_PFX }}./node_modules/.bin/electron-rebuild

      - name: Build Windows x64 EXE
        if: matrix.platform == 'win32'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: x64
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: yarn build --x64 -p never --win nsis

      - name: Build Linux amd64 DEB
        if: matrix.platform == 'linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: x64
        run: yarn build --x64 -p never --linux deb

      - name: Build macOS arm64 DMG
        if: matrix.platform == 'darwin'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: arm64
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: yarn build --arm64 -p never --mac dmg

      - name: Upload formal release package
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v6

      - name: Download all packages
        uses: actions/download-artifact@v6
        with:
          path: all-artifacts

      - name: Collect exactly three release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upload
          while IFS= read -r -d '' file; do
            cp "$file" "upload/$(basename "$file")"
          done < <(find all-artifacts -type f -print0)
          count="$(find upload -maxdepth 1 -type f | wc -l | tr -d ' ')"
          echo "Release asset count: ${count}"
          test "${count}" = "3"
          find upload -maxdepth 1 -type f -print

      - name: Resolve release tag
        shell: bash
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${RELEASE_TAG_INPUT}" ]]; then
            echo "RELEASE_TAG=${RELEASE_TAG_INPUT}" >> "$GITHUB_ENV"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_TYPE}" == "branch" ]]; then
            echo "RELEASE_TAG=v$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "RELEASE_TAG=v-draft-$(date +'%Y%m%d%H%M')" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - name: Verify formal release notes
        if: (github.event_name == 'push' && github.ref_type == 'tag') || inputs.release_tag != ''
        shell: bash
        run: test -f ".github/release-notes/${RELEASE_TAG}.md"

      - name: Upload and publish formal release
        if: (github.event_name == 'push' && github.ref_type == 'tag') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v3
        with:
          files: upload/*
          body_path: .github/release-notes/${{ env.RELEASE_TAG }}.md
          draft: false
          prerelease: false
          generate_release_notes: false
          tag_name: ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: true

      - name: Publish beta prerelease
        if: github.event_name == 'push' && github.ref_type == 'branch'
        uses: softprops/action-gh-release@v3
        with:
          files: upload/*
          body_path: .github/release-notes/${{ env.RELEASE_TAG }}.md
          draft: false
          prerelease: true
          generate_release_notes: false
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true

      - name: Upload draft release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag == ''
        uses: softprops/action-gh-release@v3
        with:
          files: upload/*
          draft: true
          prerelease: false
          generate_release_notes: true
          tag_name: ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: true
