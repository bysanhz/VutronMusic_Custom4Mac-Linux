name: Build macOS Packages

on:
  workflow_dispatch: {}

jobs:
  build-macos-arm64:
    name: Build macOS ARM64
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build ARM64 DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          yarn run build:pre
          npx electron-builder \
            --config=buildAssets/builder/config.js \
            --mac dmg \
            --arm64 \
            --publish never

      - name: Show generated files
        run: find release -maxdepth 3 -type f -print

      - name: Upload ARM64 package
        uses: actions/upload-artifact@v6
        with:
          name: VutronMusic-macOS-arm64
          path: release/**/*.dmg
          if-no-files-found: error
          retention-days: 14

  build-macos-x64:
    name: Build macOS Intel x64
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build Intel DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          yarn run build:pre
          npx electron-builder \
            --config=buildAssets/builder/config.js \
            --mac dmg \
            --x64 \
            --publish never

      - name: Show generated files
        run: find release -maxdepth 3 -type f -print

      - name: Upload Intel package
        uses: actions/upload-artifact@v6
        with:
          name: VutronMusic-macOS-x64
          path: release/**/*.dmg
          if-no-files-found: error
          retention-days: 14
