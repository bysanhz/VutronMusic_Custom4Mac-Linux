name: Test Build

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Optional note for this test build'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Test ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win32
            arch: x64
            label: Windows x64 EXE
            artifact: VutronMusic-test-win-x64-${{ github.run_number }}
            output: release/*/VutronMusic*_win_x64.exe
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            label: Linux amd64 DEB
            artifact: VutronMusic-test-linux-amd64-deb-${{ github.run_number }}
            output: release/*/VutronMusic*_linux_amd64.deb
          - os: macos-14
            platform: darwin
            arch: arm64
            label: macOS arm64 DMG
            artifact: VutronMusic-test-mac-arm64-dmg-${{ github.run_number }}
            output: release/*/VutronMusic*_mac_arm64.dmg

    runs-on: ${{ matrix.os }}
    env:
      XVFB_PFX: ${{ (matrix.platform == 'linux' && 'xvfb-run --auto-servernum -- ') || '' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn

      - name: Install Linux DEB build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot libnss3-dev libgtk-3-dev libxss-dev libgconf-2-4 libasound2

      - name: Install dependencies
        env:
          SKIP_REBUILD: true
        run: ${{ env.XVFB_PFX }}yarn install --frozen-lockfile --network-timeout 600000

      - name: Set non-release test version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TEST_VERSION="3.3.2-test.${GITHUB_RUN_NUMBER}"
          TEST_VERSION="${TEST_VERSION}" node -e "const fs=require('fs');const p=require('./package.json');p.version=process.env.TEST_VERSION;fs.writeFileSync('package.json', JSON.stringify(p, null, 2)+'\\n')"
          echo "version=${TEST_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Test version: ${TEST_VERSION}"
          echo "Note: ${{ inputs.note }}"

      - name: Fix taglib-wasm
        run: ${{ env.XVFB_PFX }}npm run fix-taglib

      - name: Rebuild native dependencies
        shell: bash
        run: |
          ${{ env.XVFB_PFX }}npm rebuild
          ${{ env.XVFB_PFX }}./node_modules/.bin/electron-rebuild

      - name: Build Windows x64 EXE
        if: matrix.platform == 'win32'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: x64
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: yarn build --x64 -p never --win nsis

      - name: Build Linux amd64 DEB
        if: matrix.platform == 'linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: x64
        run: yarn build --x64 -p never --linux deb

      - name: Build macOS arm64 DMG
        if: matrix.platform == 'darwin'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: arm64
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: yarn build --arm64 -p never --mac dmg

      - name: Upload requested test package
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}
          if-no-files-found: error
          retention-days: 14
