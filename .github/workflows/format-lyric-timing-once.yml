name: One-time format lyric timing regression

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/format-lyric-timing-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 600000

      - name: Format changed files
        run: yarn prettier src/renderer/components/LyricLine.vue tests/feature-regression.spec.ts --write

      - name: Commit formatting and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/components/LyricLine.vue tests/feature-regression.spec.ts
          git rm .github/workflows/format-lyric-timing-once.yml
          git commit -m "chore: format lyric timing fix"
          git push origin HEAD:main
