name: Publish v3.2.10 once

on:
  pull_request:
    branches:
      - main

permissions:
  actions: write
  contents: write

jobs:
  publish:
    if: github.repository == 'bysanhz/VutronMusic_Custom4Mac-Linux' && github.event_name == 'pull_request' && github.head_ref == 'automation/trigger-v3.2.10-publisher'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TARGET_SHA: 632e474a2f978641fc909711f0359c1acdf4300e
      RELEASE_TAG: v3.2.10
      STATUS_BRANCH: automation/v3.2.10-release-status
      STATUS_FILE: .release-v3.2.10-status.txt
      HELPER_MAIN_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify frozen release source
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${TARGET_SHA}^{commit}"
          test "$(git show "${TARGET_SHA}:package.json" | jq -r '.version')" = '3.2.10'
          git cat-file -e "${TARGET_SHA}:.github/release-notes/v3.2.10.md"

      - name: Create exact v3.2.10 tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          EXISTING="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha' 2>/dev/null || true)"
          if [[ -n "${EXISTING}" ]]; then
            test "${EXISTING}" = "${TARGET_SHA}"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${RELEASE_TAG}" \
              -f sha="${TARGET_SHA}" >/dev/null
          fi
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')" = "${TARGET_SHA}"

      - name: Dispatch release build from tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          STARTED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "STARTED_AT=${STARTED_AT}" >> "$GITHUB_ENV"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/dispatches" \
            -f ref="${RELEASE_TAG}"

      - name: Resolve release workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN=''
          for _ in $(seq 1 60); do
            DATA="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/runs?event=workflow_dispatch&per_page=50")"
            RUN="$(jq -c --arg sha "${TARGET_SHA}" --arg started "${STARTED_AT}" '[.workflow_runs[] | select(.head_sha == $sha and .created_at >= $started)] | sort_by(.created_at) | reverse | .[0] // empty' <<<"${DATA}")"
            [[ -n "${RUN}" ]] && break
            sleep 2
          done
          [[ -n "${RUN}" ]]
          RUN_ID="$(jq -r '.id' <<<"${RUN}")"
          echo "RELEASE_RUN_ID=${RUN_ID}" >> "$GITHUB_ENV"
          echo "RELEASE_RUN_URL=$(jq -r '.html_url' <<<"${RUN}")" >> "$GITHUB_ENV"

      - name: Publish build-start snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf /tmp/vutron-release-status
          git worktree add -B "${STATUS_BRANCH}" /tmp/vutron-release-status "${TARGET_SHA}"
          {
            printf 'tag=%s\n' "${RELEASE_TAG}"
            printf 'target_sha=%s\n' "${TARGET_SHA}"
            printf 'run_id=%s\n' "${RELEASE_RUN_ID}"
            printf 'status=building\n'
            printf 'run_url=%s\n' "${RELEASE_RUN_URL}"
          } > "/tmp/vutron-release-status/${STATUS_FILE}"
          cd /tmp/vutron-release-status
          git add "${STATUS_FILE}"
          git commit -m 'chore: record v3.2.10 release build'
          git push --force origin "HEAD:refs/heads/${STATUS_BRANCH}"

      - name: Wait for six-platform release build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          CONCLUSION=''
          for _ in $(seq 1 900); do
            RUN="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN_ID}")"
            STATUS="$(jq -r '.status' <<<"${RUN}")"
            CONCLUSION="$(jq -r '.conclusion // ""' <<<"${RUN}")"
            echo "release run ${RELEASE_RUN_ID}: status=${STATUS} conclusion=${CONCLUSION}"
            [[ "${STATUS}" == 'completed' ]] && break
            sleep 5
          done
          test "${CONCLUSION}" = 'success'

      - name: Locate and verify generated draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASES="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
          DRAFT="$(jq -c --arg started "${STARTED_AT}" '[.[] | select(.draft == true and (.tag_name | startswith("v-draft-")) and .created_at >= $started)] | sort_by(.created_at) | reverse | .[0] // empty' <<<"${RELEASES}")"
          [[ -n "${DRAFT}" ]]
          RELEASE_ID="$(jq -r '.id' <<<"${DRAFT}")"
          echo "RELEASE_ID=${RELEASE_ID}" >> "$GITHUB_ENV"

          ASSETS="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100")"
          NAMES="$(jq -r '.[].name' <<<"${ASSETS}")"
          printf '%s\n' "${NAMES}"

          grep -Fxq 'VutronMusic-3.2.10_mac_arm64.dmg' <<<"${NAMES}"
          grep -Fxq 'VutronMusic-3.2.10_mac_x64.dmg' <<<"${NAMES}"
          grep -Fxq 'VutronMusic-3.2.10_win_x64.exe' <<<"${NAMES}"
          grep -Fxq 'VutronMusic-3.2.10_win_arm64.exe' <<<"${NAMES}"
          grep -Fxq 'VutronMusic-3.2.10_linux_x86_64.AppImage' <<<"${NAMES}"
          grep -Fxq 'VutronMusic-3.2.10_linux_arm64.AppImage' <<<"${NAMES}"
          grep -Fxq 'latest.yml' <<<"${NAMES}"
          grep -Fxq 'latest-mac.yml' <<<"${NAMES}"
          grep -Fxq 'latest-linux.yml' <<<"${NAMES}"
          grep -Fxq 'latest-linux-arm64.yml' <<<"${NAMES}"

      - name: Promote the verified draft to v3.2.10 Latest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git show "${TARGET_SHA}:.github/release-notes/v3.2.10.md" > /tmp/v3.2.10-notes.md
          jq -n \
            --arg tag "${RELEASE_TAG}" \
            --arg name 'VutronMusic v3.2.10' \
            --rawfile body /tmp/v3.2.10-notes.md \
            '{tag_name:$tag,name:$name,body:$body,draft:false,prerelease:false,make_latest:"true"}' \
            > /tmp/v3.2.10-release.json
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            --input /tmp/v3.2.10-release.json >/dev/null

          FORMAL="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          test "$(jq -r '.id' <<<"${FORMAL}")" = "${RELEASE_ID}"
          test "$(jq -r '.draft' <<<"${FORMAL}")" = 'false'
          test "$(jq -r '.prerelease' <<<"${FORMAL}")" = 'false'
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')" = "${TARGET_SHA}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.id')" = "${RELEASE_ID}"

      - name: Publish final release snapshot
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/vutron-release-status
          {
            printf 'tag=%s\n' "${RELEASE_TAG}"
            printf 'target_sha=%s\n' "${TARGET_SHA}"
            printf 'run_id=%s\n' "${RELEASE_RUN_ID}"
            printf 'status=success\n'
            printf 'release_id=%s\n' "${RELEASE_ID}"
            printf 'latest=true\n'
            printf 'run_url=%s\n' "${RELEASE_RUN_URL}"
          } > "${STATUS_FILE}"
          git add "${STATUS_FILE}"
          git commit -m 'chore: record successful v3.2.10 release'
          git push --force origin "HEAD:refs/heads/${STATUS_BRANCH}"

      - name: Remove one-time publish helper from main
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${HELPER_MAIN_SHA}"
          git checkout -B main-cleanup origin/main
          git rm .github/workflows/publish-v3.2.10-once.yml
          git rm -f .release-publish-trigger-v3.2.10
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove v3.2.10 release helper'
          git push origin HEAD:main
