name: One-time VutronMusic v3.3.0 republisher

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/republish-v3.3.0-once.yml'

permissions:
  contents: write
  actions: write

jobs:
  republish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main with full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Recreate v3.3.0 tag at validated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          TARGET_SHA="$(git rev-parse HEAD^)"
          PACKAGE_VERSION="$(
            git show "${TARGET_SHA}:package.json" |
              node -e 'let s=""; process.stdin.on("data", d => s += d).on("end", () => console.log(JSON.parse(s).version))'
          )"

          echo "Validated release source: ${TARGET_SHA}"
          echo "package.json version: ${PACKAGE_VERSION}"
          test "${PACKAGE_VERSION}" = "3.3.0"
          git cat-file -e "${TARGET_SHA}:.github/release-notes/v3.3.0.md"
          git show "${TARGET_SHA}:tools/generate-app-icons.js" |
            grep -F "0ca928df122f8e3c9eb390671226edee98bd8993ef42c703f9f3d62f4ba4e6c6"

          git fetch --tags --force

          if git show-ref --tags --verify --quiet refs/tags/v3.3.0; then
            echo "Removing previous v3.3.0 tag"
            git push origin :refs/tags/v3.3.0
            git tag -d v3.3.0
          fi

          git tag -a v3.3.0 "${TARGET_SHA}" -m "VutronMusic v3.3.0"
          git push origin refs/tags/v3.3.0

      - name: Dispatch formal v3.3.0 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body             --request POST             --header "Accept: application/vnd.github+json"             --header "Authorization: Bearer ${GH_TOKEN}"             --header "X-GitHub-Api-Version: 2022-11-28"             https://api.github.com/repos/bysanhz/VutronMusic_Custom4Mac-Linux/actions/workflows/build.yml/dispatches             --data '{"ref":"v3.3.0","inputs":{"release_tag":"v3.3.0"}}'

      - name: Remove one-time republisher
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/republish-v3.3.0-once.yml
          git commit -m "chore: remove one-time v3.3.0 republisher"
          git push origin HEAD:main
