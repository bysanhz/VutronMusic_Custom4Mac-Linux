name: Prepare v3.3.2 Release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-prep-v3.3.2-once.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Bump package version
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          p.version = '3.3.2'
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n')
          NODE

      - name: Limit formal Release to three packages
        shell: bash
        run: |
          cat > .github/workflows/build.yml <<'YAML'
          name: Release

          on:
            push:
              tags:
                - 'v*.*.*'
            workflow_dispatch:
              inputs:
                release_tag:
                  description: 'Optional existing vX.Y.Z tag to publish as a formal release'
                  required: false
                  type: string

          permissions:
            contents: write

          concurrency:
            group: release-${{ github.ref }}
            cancel-in-progress: false

          jobs:
            verify:
              name: Verify release source
              runs-on: ubuntu-latest

              steps:
                - name: Checkout source
                  uses: actions/checkout@v6

                - name: Setup Node.js
                  uses: actions/setup-node@v6
                  with:
                    node-version: '22'
                    cache: yarn

                - name: Verify release tag matches package version
                  if: github.event_name == 'push' || inputs.release_tag != ''
                  shell: bash
                  env:
                    RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
                  run: |
                    set -euo pipefail
                    PACKAGE_VERSION="$(node -p "require('./package.json').version")"
                    TAG_NAME="${GITHUB_REF_NAME}"
                    if [[ -n "${RELEASE_TAG_INPUT}" ]]; then
                      TAG_NAME="${RELEASE_TAG_INPUT}"
                    fi
                    [[ "${TAG_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
                    TAG_VERSION="${TAG_NAME#v}"
                    echo "package.json version: ${PACKAGE_VERSION}"
                    echo "release tag version: ${TAG_VERSION}"
                    test "${PACKAGE_VERSION}" = "${TAG_VERSION}"

                - name: Install dependencies without native rebuild
                  run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 600000

                - name: Check formatting
                  run: yarn run format:check

                - name: Lint source
                  run: yarn lint

                - name: Type check
                  run: yarn run vue:type-check

                - name: Run security and feature regression tests
                  run: >-
                    yarn playwright test tests/security-hardening.spec.ts tests/feature-regression.spec.ts

                - name: Build renderer and main process
                  run: yarn vite --config vite.config.ts build

            package:
              name: Release ${{ matrix.label }}
              needs: verify
              strategy:
                fail-fast: false
                matrix:
                  include:
                    - os: windows-2022
                      platform: win32
                      arch: x64
                      label: Windows x64 EXE
                      artifact: VutronMusic-release-win-x64
                      output: release/*/VutronMusic*_win_x64.exe
                    - os: ubuntu-22.04
                      platform: linux
                      arch: x64
                      label: Linux amd64 DEB
                      artifact: VutronMusic-release-linux-amd64-deb
                      output: release/*/VutronMusic*_linux_amd64.deb
                    - os: macos-14
                      platform: darwin
                      arch: arm64
                      label: macOS arm64 DMG
                      artifact: VutronMusic-release-mac-arm64-dmg
                      output: release/*/VutronMusic*_mac_arm64.dmg

              runs-on: ${{ matrix.os }}
              env:
                XVFB_PFX: ${{ (matrix.platform == 'linux' && 'xvfb-run --auto-servernum -- ') || '' }}

              steps:
                - name: Checkout source
                  uses: actions/checkout@v6
                  with:
                    submodules: recursive

                - name: Setup Node.js
                  uses: actions/setup-node@v6
                  with:
                    node-version: '22'
                    cache: yarn

                - name: Install Linux DEB build dependencies
                  if: matrix.platform == 'linux'
                  run: |
                    sudo apt-get update
                    sudo apt-get install -y fakeroot libnss3-dev libgtk-3-dev libxss-dev libgconf-2-4 libasound2

                - name: Install dependencies
                  env:
                    SKIP_REBUILD: true
                  run: ${{ env.XVFB_PFX }}yarn install --frozen-lockfile --network-timeout 600000

                - name: Fix taglib-wasm
                  run: ${{ env.XVFB_PFX }}npm run fix-taglib

                - name: Rebuild native dependencies
                  shell: bash
                  run: |
                    ${{ env.XVFB_PFX }}npm rebuild
                    ${{ env.XVFB_PFX }}./node_modules/.bin/electron-rebuild

                - name: Build Windows x64 EXE
                  if: matrix.platform == 'win32'
                  shell: bash
                  env:
                    GH_TOKEN: ${{ github.token }}
                    ARCH: x64
                    CSC_IDENTITY_AUTO_DISCOVERY: 'false'
                  run: yarn build --x64 -p never --win nsis

                - name: Build Linux amd64 DEB
                  if: matrix.platform == 'linux'
                  shell: bash
                  env:
                    GH_TOKEN: ${{ github.token }}
                    ARCH: x64
                  run: yarn build --x64 -p never --linux deb

                - name: Build macOS arm64 DMG
                  if: matrix.platform == 'darwin'
                  shell: bash
                  env:
                    GH_TOKEN: ${{ github.token }}
                    ARCH: arm64
                    CSC_IDENTITY_AUTO_DISCOVERY: 'false'
                  run: yarn build --arm64 -p never --mac dmg

                - name: Upload formal release package
                  uses: actions/upload-artifact@v6
                  with:
                    name: ${{ matrix.artifact }}
                    path: ${{ matrix.output }}
                    if-no-files-found: error

            publish-release:
              name: Publish GitHub Release
              needs: package
              runs-on: ubuntu-22.04

              steps:
                - name: Checkout release metadata
                  uses: actions/checkout@v6

                - name: Download all packages
                  uses: actions/download-artifact@v6
                  with:
                    path: all-artifacts

                - name: Collect exactly three release assets
                  shell: bash
                  run: |
                    set -euo pipefail
                    mkdir -p upload
                    find all-artifacts -type f -exec cp {} upload/ \;
                    count="$(find upload -maxdepth 1 -type f | wc -l | tr -d ' ')"
                    echo "Release asset count: ${count}"
                    test "${count}" = "3"
                    find upload -maxdepth 1 -type f -print

                - name: Resolve release tag
                  shell: bash
                  env:
                    RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
                  run: |
                    if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${RELEASE_TAG_INPUT}" ]]; then
                      echo "RELEASE_TAG=${RELEASE_TAG_INPUT}" >> "$GITHUB_ENV"
                    elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
                      echo "RELEASE_TAG=v-draft-$(date +'%Y%m%d%H%M')" >> "$GITHUB_ENV"
                    else
                      echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
                    fi

                - name: Verify formal release notes
                  if: github.event_name == 'push' || inputs.release_tag != ''
                  shell: bash
                  run: test -f ".github/release-notes/${RELEASE_TAG}.md"

                - name: Upload and publish formal release
                  if: github.event_name == 'push' || inputs.release_tag != ''
                  uses: softprops/action-gh-release@v3
                  with:
                    files: upload/*
                    body_path: .github/release-notes/${{ env.RELEASE_TAG }}.md
                    draft: false
                    prerelease: false
                    generate_release_notes: false
                    tag_name: ${{ env.RELEASE_TAG }}
                    fail_on_unmatched_files: true

                - name: Upload draft release
                  if: github.event_name == 'workflow_dispatch' && inputs.release_tag == ''
                  uses: softprops/action-gh-release@v3
                  with:
                    files: upload/*
                    draft: true
                    prerelease: false
                    generate_release_notes: true
                    tag_name: ${{ env.RELEASE_TAG }}
                    fail_on_unmatched_files: true
          YAML

      - name: Write v3.3.2 release notes
        shell: bash
        run: |
          cat > .github/release-notes/v3.3.2.md <<'MD'
          # VutronMusic v3.3.2

          v3.3.2 focuses on desktop-lyric interaction stability, word-by-word lyric timing, tray behavior, and a smaller release matrix.

          ## Desktop lyrics

          - Fixed Windows locked desktop lyrics so mouse passthrough can auto-hide on idle and reliably restore when the pointer leaves.
          - Consolidated Windows lock state and mouse-ignore handling to reduce conflicting native window state changes.
          - Fixed drag and resize regressions around the desktop lyric window and kept resize hit regions from competing with the drag handle.
          - Added a unified bottom lock/unlock control shared by normal and compact desktop-lyric modes.
          - Refined the bottom drag handle to be shorter, rounder, and less visually intrusive when not hovered.
          - Fixed alignment of the dynamically injected “show cover and controls” setting with the other settings-page toggles.

          ## Lyrics

          - Fixed the word-by-word lyric animation timeline to use the lyric-line start as the common time origin.
          - Removed the first-word jumping/flashing caused by mixing line timestamps and first-word timestamps.
          - This also removes the systematic lead-in error that previously made many tracks appear to require about `-0.7 s` of manual lyric offset.

          ## Tray and cross-platform stability

          - Fixed the Windows tray context menu so it can open even when the main window is hidden.
          - Fixed a Linux tray-menu recursion bug that could overflow the call stack and abort main-process initialization, which in turn prevented desktop lyrics and IPC handlers from starting.

          ## Release packages

          Starting with v3.3.2, formal GitHub Releases publish only these three packages:

          - Windows x64 installer: `VutronMusic-*_win_x64.exe`
          - Linux amd64 package: `VutronMusic-*_linux_amd64.deb`
          - macOS Apple Silicon package: `VutronMusic-*_mac_arm64.dmg`

          macOS packages are unsigned/not notarized. If Gatekeeper blocks the downloaded app, follow the repository README instructions for removing the quarantine attribute from VutronMusic only.
          MD

      - name: Update README release section
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text()
          s = s.replace(
              '**当前正式版本：[`v3.3.1`](https://github.com/bysanhz/VutronMusic_Custom4Mac-Linux/releases/tag/v3.3.1)**（2026-09-07）。',
              '**当前正式版本：[`v3.3.2`](https://github.com/bysanhz/VutronMusic_Custom4Mac-Linux/releases/tag/v3.3.2)**（2026-09-11）。'
          )
          old_table = '''| 平台 | 架构 | 安装包 | 更新方式 |
          | --- | --- | --- | --- |
          | Linux | x86_64 | AppImage / Deb / RPM / Snap | AppImage 支持应用内更新；其他格式跳转 Release |
          | Linux | ARM64 | AppImage / Deb / RPM | 应用内检查版本，跳转 Release 手动下载 |
          | macOS | Apple Silicon | 本机源码构建（推荐）/ 未签名 DMG arm64 | 应用内检查版本，跳转 Release |
          | macOS | Intel | 本机源码构建（推荐）/ 未签名 DMG x64 | 应用内检查版本，跳转 Release |
          | Windows | x64 | 安装版 / Portable | 安装版支持应用内更新；Portable 跳转 Release 手动下载 |
          | Windows | ARM64 | 安装版 | 支持应用内更新 |
          '''
          new_table = '''| 平台 | 架构 | 正式 Release 安装包 |
          | --- | --- | --- |
          | Windows | x64 | `VutronMusic-*_win_x64.exe` |
          | Linux | x86_64 / amd64 | `VutronMusic-*_linux_amd64.deb` |
          | macOS | Apple Silicon / arm64 | `VutronMusic-*_mac_arm64.dmg` |
          '''
          s = s.replace(old_table, new_table)
          marker = '### v3.3.1 稳定性更新\n'
          section = '''### v3.3.2 桌面歌词与跨平台稳定性更新

          - 统一桌面歌词底部锁定 / 解锁入口，并继续保留锁定后的鼠标穿透与自动隐藏 / 恢复逻辑；
          - 修复 Windows 桌面歌词拖动、拉伸、托盘菜单等交互问题，并降低底部拖动 Bar 的视觉干扰；
          - 修复 Linux 托盘菜单递归导致的主进程栈溢出和后续 IPC / 桌面歌词初始化失败；
          - 修复逐字歌词第一词闪烁及时间轴零点不一致的问题；
          - 正式 Release 收敛为 Windows x64 EXE、Linux amd64 DEB、macOS arm64 DMG 三个安装包。

          完整版本说明见 [`v3.3.2 Release`](https://github.com/bysanhz/VutronMusic_Custom4Mac-Linux/releases/tag/v3.3.2)。

          '''
          if marker in s and '### v3.3.2 桌面歌词与跨平台稳定性更新' not in s:
              s = s.replace(marker, section + marker, 1)
          s = s.replace(
              '先根据 Mac 架构选择正确的安装包：\n\n- Apple Silicon（M1/M2/M3/M4/M5 等）下载 `arm64` DMG；\n- Intel Mac 下载 `x64` DMG。',
              '当前正式 Release 仅提供 Apple Silicon（M1/M2/M3/M4/M5 等）的 `arm64` DMG。Intel Mac 暂不提供预构建 DMG，可继续按本文“macOS 本机构建”说明从源码构建。'
          )
          p.write_text(s)
          PY

      - name: Commit release preparation and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json README.md .github/workflows/build.yml .github/release-notes/v3.3.2.md
          git rm .github/workflows/release-prep-v3.3.2-once.yml
          git commit -m "chore: prepare v3.3.2 release"
          git push origin HEAD:main
