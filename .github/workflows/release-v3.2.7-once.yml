name: Export formatted release workflows

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v3.2.7-once.yml'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies without native rebuild
        run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 600000

      - name: Export Prettier output
        shell: bash
        run: |
          set -euo pipefail
          yarn prettier . --write
          mkdir -p .release-prettier-output
          cp .github/workflows/build.yml .release-prettier-output/build.yml.txt
          cp .github/workflows/ci.yml .release-prettier-output/ci.yml.txt
          git checkout HEAD -- \
            .github/workflows/build.yml \
            .github/workflows/ci.yml \
            .github/workflows/release-v3.2.7-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .release-prettier-output
          git commit -m 'chore(release): export formatted workflow sources'
          git push origin HEAD:main
