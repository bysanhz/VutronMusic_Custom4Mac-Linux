name: Prepare v3.2.7 source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v3.2.7-once.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies without native rebuild
        run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 600000

      - name: Apply Prettier
        run: yarn prettier . --write

      - name: Commit formatting and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'style: apply Prettier before v3.2.7 release'
          fi
          git rm .github/workflows/release-v3.2.7-once.yml
          git commit -m 'chore(release): remove one-shot formatter'
          git push origin HEAD:main
