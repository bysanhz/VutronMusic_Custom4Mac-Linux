name: One-time repair v3.3.1 Windows updater metadata

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/repair-v3.3.1-windows-metadata-once.yml'

permissions:
  contents: write
  actions: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download Windows metadata artifacts from v3.3.1 release run
        uses: actions/download-artifact@v6
        with:
          run-id: 34118559694
          github-token: ${{ github.token }}
          pattern: VutronMusic-win-*-metadata
          path: updater-artifacts

      - name: Prepare architecture-specific updater metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p updater-upload

          X64_META="$(find updater-artifacts/VutronMusic-win-x64-metadata -type f -name latest.yml -print -quit)"
          ARM64_META="$(find updater-artifacts/VutronMusic-win-arm64-metadata -type f -name latest.yml -print -quit)"

          test -n "${X64_META}"
          test -n "${ARM64_META}"

          grep -F "VutronMusic-3.3.1_win_x64.exe" "${X64_META}"
          grep -F "VutronMusic-3.3.1_win_arm64.exe" "${ARM64_META}"

          cp "${X64_META}" updater-upload/latest-win-x64.yml
          cp "${ARM64_META}" updater-upload/latest-win-arm64.yml

          # v3.3.0 Windows x64 客户端仍读取 generic latest.yml，
          # 因此用 x64 元数据覆盖它，保证一次过渡更新能够完成。
          cp "${X64_META}" updater-upload/latest.yml

          echo "Prepared:"
          ls -lh updater-upload

      - name: Upload repaired metadata to v3.3.1 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload v3.3.1             updater-upload/latest-win-x64.yml             updater-upload/latest-win-arm64.yml             updater-upload/latest.yml             --clobber

      - name: Remove one-time repair workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-v3.3.1-windows-metadata-once.yml
          git commit -m "chore: remove one-time v3.3.1 metadata repair"
          git push origin HEAD:main
