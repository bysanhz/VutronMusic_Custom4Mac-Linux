name: Fix player race type once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-player-race-type-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Patch TypeScript error
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/renderer/store/player.ts')
          text = path.read_text()
          target = '          showToast(error)\n'
          replacement = '          showToast(error instanceof Error ? error.message : String(error))\n'
          if text.count(target) != 1:
              raise SystemExit(f'expected one target, found {text.count(target)}')
          path.write_text(text.replace(target, replacement, 1))
          PY
          git diff --check

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/store/player.ts
          git commit -m "fix: normalize player metadata errors for toast"
          git push origin HEAD:main
