name: Patch player track-state race

on:
  push:
    branches:
      - fix/player-track-state-race
    paths:
      - tools/patch-player-track-state-race.py
      - .github/workflows/patch-player-track-state-race.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/player-track-state-race
          fetch-depth: 0

      - name: Apply guarded player patch
        run: python tools/patch-player-track-state-race.py

      - name: Validate patch shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q "let trackLoadRevision = 0" src/renderer/store/player.ts
          grep -q "const revision = ++trackLoadRevision" src/renderer/store/player.ts
          grep -q "revision = trackLoadRevision" src/renderer/store/player.ts
          grep -q "if (revision !== trackLoadRevision) return false" src/renderer/store/player.ts

      - name: Commit patched source and remove temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          git rm tools/patch-player-track-state-race.py .github/workflows/patch-player-track-state-race.yml
          git add src/renderer/store/player.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: prevent stale track metadata from overwriting playback state"
          git push origin HEAD:fix/player-track-state-race
