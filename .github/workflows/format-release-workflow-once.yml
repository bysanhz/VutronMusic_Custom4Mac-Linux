name: Format Release Workflow Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/format-release-workflow-once.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: yarn

      - name: Install dependencies without scripts
        run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 600000

      - name: Print Prettier-formatted release workflow
        shell: bash
        run: |
          yarn prettier .github/workflows/build.yml --write
          echo '===== PRETTIER BUILD.YML BEGIN ====='
          cat .github/workflows/build.yml
          echo '===== PRETTIER BUILD.YML END ====='
