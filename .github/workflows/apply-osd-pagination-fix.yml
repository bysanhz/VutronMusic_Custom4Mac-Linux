name: Apply OSD and pagination fix

on:
  push:
    branches:
      - fix/osd-defaults-and-explore-pagination

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/osd-defaults-and-explore-pagination
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn
      - run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 600000
      - name: Apply fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing target in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          # 1) Persisted/default OSD palette: one canonical palette everywhere.
          replace_once(
              'src/renderer/store/osdLyric.ts',
              "const BUILTIN_LYRIC_PALETTE_VERSION = '1'",
              "const BUILTIN_LYRIC_PALETTE_VERSION = '2'"
          )

          preset = Path('src/renderer/utils/osdLyricPresetSettings.ts')
          text = preset.read_text()
          old = """const COVER_CONTROLS_STORAGE_KEY = 'vutronmusic-osd-cover-controls-visible'\nconst MAX_USER_PRESETS = 50\n"""
          new = """const COVER_CONTROLS_STORAGE_KEY = 'vutronmusic-osd-cover-controls-visible'\nconst MAX_USER_PRESETS = 50\nconst BUILTIN_LYRIC_BACKGROUND = 'rgba(0, 0, 0, 0)'\nconst BUILTIN_LYRIC_PLAYED = 'rgba(7, 185, 187, 1)'\nconst BUILTIN_LYRIC_UNPLAYED = 'rgba(239, 152, 207, 1)'\nconst BUILTIN_LYRIC_SHADOW = 'rgba(0, 0, 0, 0)'\n"""
          if old not in text:
              raise SystemExit('preset constants insertion target missing')
          text = text.replace(old, new, 1)

          text = text.replace(
              """    backgroundColor: 'rgba(0, 0, 0, 0)',\n    playedLrcColor: '#37cf88',\n    unplayLrcColor: 'rgba(210, 210, 210, 1)',\n    textShadow: 'rgba(0, 0, 0, 0.2)',\n""",
              """    backgroundColor: BUILTIN_LYRIC_BACKGROUND,\n    playedLrcColor: BUILTIN_LYRIC_PLAYED,\n    unplayLrcColor: BUILTIN_LYRIC_UNPLAYED,\n    textShadow: BUILTIN_LYRIC_SHADOW,\n""",
              1
          )

          old_center = """        align: 'center',\n        coverControlsVisible: false,\n        playedLrcColor: 'rgba(255, 255, 255, 1)',\n        unplayLrcColor: 'rgba(185, 185, 185, 1)',\n        textShadow: 'rgba(0, 0, 0, 0.5)'\n"""
          new_center = """        align: 'center',\n        coverControlsVisible: false\n"""
          if old_center not in text:
              raise SystemExit('centered preset override target missing')
          text = text.replace(old_center, new_center, 1)

          old_cover = """        mode: 'twoLines',\n        translationMode: 'tlyric',\n        align: 'center',\n        coverControlsVisible: true\n"""
          new_cover = """        mode: 'twoLines',\n        translationMode: 'tlyric',\n        align: 'left',\n        coverControlsVisible: true\n"""
          if old_cover not in text:
              raise SystemExit('cover preset alignment target missing')
          text = text.replace(old_cover, new_cover, 1)

          text = text.replace(
              "String(settings.backgroundColor || 'rgba(0, 0, 0, 0)')",
              'String(settings.backgroundColor || BUILTIN_LYRIC_BACKGROUND)'
          )
          text = text.replace(
              "String(settings.playedLrcColor || '#37cf88')",
              'String(settings.playedLrcColor || BUILTIN_LYRIC_PLAYED)'
          )
          text = text.replace(
              "String(settings.unplayLrcColor || 'rgba(210, 210, 210, 1)')",
              'String(settings.unplayLrcColor || BUILTIN_LYRIC_UNPLAYED)'
          )
          text = text.replace(
              "String(settings.textShadow || 'rgba(0, 0, 0, 0.2)')",
              'String(settings.textShadow || BUILTIN_LYRIC_SHADOW)'
          )
          text = text.replace(
              "String(state.backgroundColor || 'rgba(0, 0, 0, 0)')",
              'String(state.backgroundColor || BUILTIN_LYRIC_BACKGROUND)'
          )
          text = text.replace(
              "String(state.playedLrcColor || '#37cf88')",
              'String(state.playedLrcColor || BUILTIN_LYRIC_PLAYED)'
          )
          text = text.replace(
              "String(state.unplayLrcColor || 'rgba(210, 210, 210, 1)')",
              'String(state.unplayLrcColor || BUILTIN_LYRIC_UNPLAYED)'
          )
          text = text.replace(
              "String(state.textShadow || 'rgba(0, 0, 0, 0.2)')",
              'String(state.textShadow || BUILTIN_LYRIC_SHADOW)'
          )
          preset.write_text(text)

          # 2) Compact desktop lyric: use actual 45 px cover width, minimal gap.
          replace_once(
              'src/renderer/views/OSDLyric.vue',
              """  grid-template-columns:\n    50px\n    minmax(0, 1fr);\n\n  column-gap: 1px;\n""",
              """  grid-template-columns:\n    45px\n    minmax(0, 1fr);\n\n  column-gap: 2px;\n"""
          )
          replace_once(
              'src/renderer/views/OSDLyric.vue',
              """  justify-content: center;\n\n  min-width: 0;\n  height: 100%;\n}\n\n.compact-lyric-panel {\n""",
              """  justify-content: flex-start;\n\n  min-width: 0;\n  height: 100%;\n}\n\n.compact-lyric-panel {\n"""
          )
          replace_once(
              'src/renderer/views/OSDLyric.vue',
              """  width: 100%;\n  height: 100%;\n  min-width: 0;\n\n  overflow: hidden;\n}\n\n.compact-lyric-panel :deep(.lyric) {\n""",
              """  width: 100%;\n  height: 100%;\n  min-width: 0;\n  padding-left: 0;\n\n  overflow: hidden;\n}\n\n.compact-lyric-panel :deep(.lyric) {\n"""
          )

          # 3) Explore pagination: do not trust a missing/false `more` field over total/page size.
          explore = Path('src/renderer/views/ExplorePage.vue')
          text = explore.read_text()
          old = """const followingMvs = ref<any[]>([])\nconst loadingMore = ref(false)\n"""
          new = """const followingMvs = ref<any[]>([])\nconst loadingMore = ref(false)\nconst PLAYLIST_PAGE_SIZE = 50\n"""
          if old not in text:
              raise SystemExit('playlist page size insertion target missing')
          text = text.replace(old, new, 1)

          old = """const canLoadMore = () => {\n  if (exploreTab.value === 'playlist') {\n    return !['推荐歌单', '排行榜'].includes(activeCategory.value) && playlistInfo.more\n  }\n"""
          new = """const canLoadMore = () => {\n  if (exploreTab.value === 'playlist') {\n    if (['推荐歌单', '排行榜'].includes(activeCategory.value)) return false\n    if (playlistInfo.total > 0) return playlists.value.length < playlistInfo.total\n    return playlistInfo.more\n  }\n"""
          if old not in text:
              raise SystemExit('canLoadMore target missing')
          text = text.replace(old, new, 1)

          old = """    return topPlaylist({\n      cat: activeCategory.value,\n      limit: 50,\n      offset: playlists.value.length\n    }).then((data) => {\n      playlistInfo.more = Boolean(data.more) && Boolean(data.playlists?.length)\n      playlistInfo.total = data.total\n      playlistInfo.lasttime = 0\n      updatePlaylist(data.playlists)\n    })\n"""
          new = """    return topPlaylist({\n      cat: activeCategory.value,\n      limit: PLAYLIST_PAGE_SIZE,\n      offset: playlists.value.length\n    }).then((data) => {\n      const page = Array.isArray(data?.playlists) ? data.playlists : []\n      const reportedTotal = Number(data?.total)\n      if (Number.isFinite(reportedTotal) && reportedTotal > 0) {\n        playlistInfo.total = reportedTotal\n      }\n      playlistInfo.lasttime = 0\n      updatePlaylist(page)\n\n      const moreByTotal =\n        playlistInfo.total > 0 ? playlists.value.length < playlistInfo.total : page.length >= PLAYLIST_PAGE_SIZE\n      playlistInfo.more = data?.more === true || moreByTotal\n    })\n"""
          if old not in text:
              raise SystemExit('topPlaylist pagination target missing')
          text = text.replace(old, new, 1)
          explore.write_text(text)

          # 4) Virtual list: listen to both internal and parent/main scrolling.
          virtual = Path('src/renderer/components/VirtualScrollNoHeight.vue')
          text = virtual.read_text()
          marker = """const scrollEvent = rafThrottle(() => {\n  onScrollToBottom()\n  onScroll()\n})\n\n/**\n * 条件：\n"""
          replacement = """const scrollEvent = rafThrottle(() => {\n  onScrollToBottom()\n  onScroll()\n})\n\nlet parentScrollElement: HTMLElement | null = null\n\nconst parentScrollEvent = rafThrottle(() => {\n  const element = listRef.value as HTMLElement | undefined\n  if (!element) return\n\n  const rect = element.getBoundingClientRect()\n  const mainRect = mainRef.value?.getBoundingClientRect()\n  const visibleBottom = Math.min(\n    window.innerHeight - playerBarInset.value,\n    mainRect?.bottom ?? window.innerHeight\n  )\n  if (rect.bottom <= visibleBottom + 240) {\n    void requestLoadMore()\n  }\n})\n\nconst bindParentScrollListener = () => {\n  const nextElement = mainRef.value ?? null\n  if (parentScrollElement === nextElement) return\n  parentScrollElement?.removeEventListener('scroll', parentScrollEvent)\n  parentScrollElement = nextElement\n  parentScrollElement?.addEventListener('scroll', parentScrollEvent, { passive: true })\n}\n\nconst unbindParentScrollListener = () => {\n  parentScrollElement?.removeEventListener('scroll', parentScrollEvent)\n  parentScrollElement = null\n}\n\n/**\n * 条件：\n"""
          if marker not in text:
              raise SystemExit('virtual scroll parent-listener insertion target missing')
          text = text.replace(marker, replacement, 1)

          text = text.replace(
              """    observer.observe(listRef.value)\n    observeLoadMoreSentinel()\n    setTimeout(() => {\n""",
              """    observer.observe(listRef.value)\n    observeLoadMoreSentinel()\n    bindParentScrollListener()\n    setTimeout(() => {\n"""
          )
          text = text.replace(
              """  unregisterInstance(instanceId.value)\n  loadMoreObserver?.disconnect()\n  observer.unobserve(listRef.value)\n""",
              """  unregisterInstance(instanceId.value)\n  loadMoreObserver?.disconnect()\n  unbindParentScrollListener()\n  observer.unobserve(listRef.value)\n""",
              1
          )
          text = text.replace(
              """    observer.observe(listRef.value)\n    observeLoadMoreSentinel()\n    setTimeout(() => {\n""",
              """    observer.observe(listRef.value)\n    observeLoadMoreSentinel()\n    bindParentScrollListener()\n    setTimeout(() => {\n""",
              1
          )
          old_unmount = """  unregisterInstance(instanceId.value)\n  loadMoreObserver?.disconnect()\n  window.removeEventListener('resize', updateWindowHeight)\n"""
          new_unmount = """  unregisterInstance(instanceId.value)\n  loadMoreObserver?.disconnect()\n  unbindParentScrollListener()\n  window.removeEventListener('resize', updateWindowHeight)\n"""
          if old_unmount not in text:
              raise SystemExit('virtual scroll unmount target missing')
          text = text.replace(old_unmount, new_unmount, 1)
          virtual.write_text(text)
          PY

          yarn prettier \
            src/renderer/store/osdLyric.ts \
            src/renderer/utils/osdLyricPresetSettings.ts \
            src/renderer/views/OSDLyric.vue \
            src/renderer/views/ExplorePage.vue \
            src/renderer/components/VirtualScrollNoHeight.vue \
            --write
      - name: Verify
        run: |
          yarn lint
          yarn run vue:type-check
          yarn playwright test tests/security-hardening.spec.ts tests/feature-regression.spec.ts
          yarn vite --config vite.config.ts build
      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/renderer/store/osdLyric.ts src/renderer/utils/osdLyricPresetSettings.ts src/renderer/views/OSDLyric.vue src/renderer/views/ExplorePage.vue src/renderer/components/VirtualScrollNoHeight.vue
          git commit -m "fix: align OSD defaults and make explore pagination reliable"
          git push origin HEAD:fix/osd-defaults-and-explore-pagination
