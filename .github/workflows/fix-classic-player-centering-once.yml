name: Fix Classic player centering once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-classic-player-centering-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies without native rebuild
        run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 600000

      - name: Apply centering repair
        run: python .github/scripts/fix_classic_player_centering.py

      - name: Format changed files
        run: |
          yarn prettier src/renderer/components/CommonPlayer.vue tests/feature-regression.spec.ts --write
          git diff --check

      - name: Type check
        run: yarn run vue:type-check

      - name: Run feature regression tests
        run: yarn playwright test tests/feature-regression.spec.ts

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/components/CommonPlayer.vue tests/feature-regression.spec.ts
          git commit -m "fix: keep Classic cover centered in compact layouts"
          git push origin HEAD:main
