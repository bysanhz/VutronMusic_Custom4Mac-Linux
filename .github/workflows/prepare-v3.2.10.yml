name: Prepare v3.2.10 release source

on:
  push:
    branches:
      - automation/prepare-v3.2.10

permissions:
  contents: write

jobs:
  prepare-and-verify:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: e8d4b75e6c3e521911e972c947c620231b4c1a7f
      RESULT_BRANCH: automation/prepare-v3.2.10-result
      NOTES_B64: 
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify exact main SHA
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${BASE_SHA}"
          git checkout -B "${RESULT_BRANCH}" origin/main

      - name: Prepare version and release notes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('package.json')
          text = path.read_text()
          old = '"version": "3.2.9"'
          new = '"version": "3.2.10"'
          if text.count(old) != 1:
              raise SystemExit(f'unexpected version occurrence count: {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          printf '%s' "${NOTES_B64}" | base64 --decode > .github/release-notes/v3.2.10.md

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies without native rebuild
        run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 600000

      - name: Format release files
        run: yarn prettier --write package.json .github/release-notes/v3.2.10.md

      - name: Check formatting
        run: yarn run format:check

      - name: Lint source
        run: yarn lint

      - name: Type check
        run: yarn run vue:type-check

      - name: Run security and feature regression tests
        run: yarn playwright test tests/security-hardening.spec.ts tests/feature-regression.spec.ts

      - name: Build renderer and main process
        run: yarn vite --config vite.config.ts build

      - name: Verify focused release diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(node -p "require('./package.json').version")" = '3.2.10'
          test "$(git diff --name-only | sort)" = $'.github/release-notes/v3.2.10.md\npackage.json'
          git diff -- package.json | grep -Fq -- '-  "version": "3.2.9"'
          git diff -- package.json | grep -Fq -- '+  "version": "3.2.10"'
          test "$(git diff --numstat -- package.json | awk '{print $1":"$2}')" = '1:1'

      - name: Commit verified release source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json .github/release-notes/v3.2.10.md
          git commit -m 'chore: prepare v3.2.10 release'
          git push --force origin "HEAD:refs/heads/${RESULT_BRANCH}"
