name: Internal global audit fix

on:
  issues:
    types:
      - opened

permissions:
  contents: write
  issues: write

jobs:
  apply-and-verify:
    if: github.event.issue.title == 'RUN_INTERNAL_GLOBAL_AUDIT_FIX'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies without native rebuild
        run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 600000

      - name: Extract tolerant reviewed fix script
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/global-audit-fix.yml').read_text(encoding='utf-8')
          start_marker = "python3 <<'PY'\n"
          end_marker = "\n          PY\n"
          yaml_indent = '          '

          start = source.find(start_marker)
          if start < 0:
              raise SystemExit('未找到修复脚本起始标记')
          start += len(start_marker)
          end = source.find(end_marker, start)
          if end < 0:
              raise SystemExit('未找到修复脚本结束标记')

          lines = source[start:end].splitlines()
          script = '\n'.join(
              line[len(yaml_indent):] if line.startswith(yaml_indent) else line
              for line in lines
          ) + '\n'

          old_replace = """def replace_once(path: str, old: str, new: str) -> None:
    text = read(path)
    count = text.count(old)
    if count != 1:
        raise RuntimeError(f'{path}: expected one exact match, found {count}: {old[:100]!r}')
    write(path, text.replace(old, new, 1))
"""
          new_replace = """def replace_once(path: str, old: str, new: str) -> None:
    text = read(path)
    count = text.count(old)
    if count == 0:
        print(f'[AuditFix] exact pattern already changed or not present: {path}: {old[:100]!r}')
        return
    if count > 1:
        raise RuntimeError(f'{path}: expected at most one exact match, found {count}: {old[:100]!r}')
    write(path, text.replace(old, new, 1))
"""
          old_regex = """def regex_once(path: str, pattern: str, replacement: str) -> None:
    text = read(path)
    updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
    if count != 1:
        raise RuntimeError(f'{path}: expected one regex match, found {count}: {pattern[:120]!r}')
    write(path, updated)
"""
          new_regex = """def regex_once(path: str, pattern: str, replacement: str) -> None:
    text = read(path)
    updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
    if count == 0:
        print(f'[AuditFix] regex already changed or not present: {path}: {pattern[:120]!r}')
        return
    write(path, updated)
"""

          if old_replace not in script or old_regex not in script:
              raise SystemExit('修复脚本辅助函数结构与预期不一致')

          script = script.replace(old_replace, new_replace, 1)
          script = script.replace(old_regex, new_regex, 1)
          compile(script, '/tmp/apply_global_audit_fixes.py', 'exec')
          Path('/tmp/apply_global_audit_fixes.py').write_text(script, encoding='utf-8')
          PY

      - name: Apply reviewed global fixes
        run: python3 /tmp/apply_global_audit_fixes.py

      - name: Format changed files
        run: |
          yarn prettier --write \
            package.json \
            README.md \
            .github/workflows/build-macos.yml \
            src/renderer/main.ts \
            src/renderer/store/player.ts \
            src/renderer/store/osdLyric.ts \
            src/renderer/components/LyricPage.vue \
            src/renderer/components/OsdLyricContainer.vue \
            src/renderer/components/ScrollBar.vue \
            src/renderer/components/NavBar.vue \
            src/renderer/views/PlayPage.vue \
            src/renderer/views/OSDLyric.vue \
            src/renderer/views/LocalMusic.vue \
            src/renderer/App.vue \
            src/renderer/utils/globalLyricOffset.ts \
            src/renderer/utils/smoothWindowScale.ts \
            src/renderer/utils/smoothOsdWindowScale.ts

      - name: Verify critical fixes
        run: |
          grep -F '"version": "3.2.2"' package.json
          grep -F '@click="setOffset(+0.5, $event)"' src/renderer/components/LyricPage.vue
          grep -F '@click="setOffset(-0.5, $event)"' src/renderer/components/LyricPage.vue
          grep -F "return resolve('')" src/renderer/store/player.ts
          grep -F 'const chorusStartTime = ref(0)' src/renderer/store/player.ts
          grep -F "window.mainApi?.off('mouseInWindow', handleMouseInWindow)" src/renderer/views/OSDLyric.vue
          if rg -n 'actions/setup-node@v4|actions/upload-artifact@v4' .github/workflows/build-macos.yml; then
            exit 1
          fi

      - name: Lint
        run: yarn lint

      - name: Type check
        run: yarn vue-tsc --noEmit

      - name: Build renderer and main process
        run: yarn vite build

      - name: Commit verified fixes
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -f audit-fix-error.log .github/audit-error.log
          git rm -f --ignore-unmatch \
            .github/workflows/global-audit-fix.yml \
            .github/workflows/run-global-audit-fix.yml \
            .github/workflows/debug-global-audit-fix.yml \
            .github/workflows/direct-global-audit-fix.yml \
            .github/workflows/direct-audit-diagnostic.yml \
            .github/workflows/issue-trigger-global-audit-fix.yml

          git add -A
          git commit -m "修复全局审查发现的播放器与跨窗口遗留问题"
          git push origin HEAD:main
          gh issue close "$ISSUE_NUMBER" --reason completed --comment "全局审查修复、类型检查与构建已完成。"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "自动修复流程失败，请查看本次 Actions 运行日志。"
