name: One-time format Windows OSD fixes

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/format-windows-osd-fixes-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 600000

      - name: Format changed files
        run: >-
          yarn prettier
          src/main/index.ts
          src/main/IPCs.ts
          src/main/osdPartialMousePassthrough.ts
          src/preload/osdWin.ts
          src/renderer/views/OSDLyric.vue
          src/renderer/components/OsdHeader.vue
          tests/feature-regression.spec.ts
          --write

      - name: Commit formatting and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/index.ts src/main/IPCs.ts src/main/osdPartialMousePassthrough.ts src/preload/osdWin.ts src/renderer/views/OSDLyric.vue src/renderer/components/OsdHeader.vue tests/feature-regression.spec.ts
          git rm .github/workflows/format-windows-osd-fixes-once.yml
          git commit -m "chore: format Windows OSD fixes"
          git push origin HEAD:main
