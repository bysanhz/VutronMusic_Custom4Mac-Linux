name: Apply theme polish fix

on:
  push:
    branches:
      - automation/fix-mute-and-slider-dots

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v6
        with:
          ref: automation/fix-mute-and-slider-dots
          fetch-depth: 0

      - name: Apply dark-theme and custom-accent fixes
        env:
          PATCH_SCRIPT_B64: 
        run: |
          printf '%s' "$PATCH_SCRIPT_B64" | base64 -d > /tmp/apply_theme_polish.py
          python /tmp/apply_theme_polish.py

      - name: Remove one-time helper before validation
        run: rm .github/workflows/apply-theme-polish-fix.yml

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies without native rebuild
        run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 600000

      - name: Format changed source
        run: >-
          yarn prettier --write
          src/renderer/views/SystemSettings.vue
          src/renderer/utils/v327FeatureShared.ts
          tests/feature-regression.spec.ts

      - name: Check formatting
        run: yarn run format:check

      - name: Lint source
        run: yarn lint

      - name: Type check
        run: yarn run vue:type-check

      - name: Run security and feature regression tests
        run: >-
          yarn playwright test tests/security-hardening.spec.ts tests/feature-regression.spec.ts

      - name: Build renderer and main process
        run: yarn vite --config vite.config.ts build

      - name: Commit verified fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "fix: polish dark theme and custom accent"
          git push origin HEAD:automation/fix-mute-and-slider-dots
