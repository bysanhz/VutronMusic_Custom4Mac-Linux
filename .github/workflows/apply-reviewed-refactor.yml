              '<button-icon title="延后0.5s（应用于所有歌曲）" @click="setOffset(+0.5)">',
              '<button-icon title="延后0.5s；按住 Shift 精调0.1s（应用于所有歌曲）" @click="setOffset(+0.5, $event)">'
          )
          replace_once(
