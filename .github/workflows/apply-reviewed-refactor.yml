name: Apply reviewed refactor

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-reviewed-refactor.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Apply reviewed changes
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json
          import re

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8')

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one exact match, found {count}: {old[:80]!r}')
              write(path, text.replace(old, new, 1))

          def regex_once(path: str, pattern: str, replacement: str) -> None:
              text = read(path)
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one regex match, found {count}: {pattern[:100]!r}')
              write(path, updated)

          # ======== newADD start======
          # 全局歌词偏移改为“单曲偏移 + 全局偏移”，不再写回 currentTrack.offset。
          player_path = 'src/renderer/store/player.ts'
          replace_once(
              player_path,
              "import { extractExpirationFromUrl } from '../utils'\n",
              "import { extractExpirationFromUrl } from '../utils'\nimport { globalLyricOffset, setGlobalLyricOffset } from '../utils/globalLyricOffset'\n"
          )
          replace_once(
              player_path,
              "    const lyricOffset = computed(() => {\n      return currentTrack.value?.offset ?? 0\n    })",
              "    /**\n     * 播放器最终使用的歌词偏移。\n     *\n     * 单曲 offset 保留歌曲自身的校正值；globalLyricOffset 是用户针对全部歌曲设置的\n     * 统一偏移。二者相加后供主歌词、逐字歌词、桌面歌词和托盘歌词共同使用。\n     */\n    const lyricOffset = computed(() => {\n      const trackOffset = Number(currentTrack.value?.offset) || 0\n      return Math.round((trackOffset + globalLyricOffset.value) * 10) / 10\n    })"
          )
          replace_once(
              player_path,
              "              chorus.value = res.chorus[0].startTime / 1000 - (currentTrack.value?.offset || 0)",
              "              chorus.value = res.chorus[0].startTime / 1000 - lyricOffset.value"
          )
          replace_once(
              player_path,
              "      lyricOffset,\n      volume,",
              "      lyricOffset,\n      globalLyricOffset,\n      volume,"
          )
          replace_once(
              player_path,
              "      setConvolver,\n      replacePlaylist,",
              "      setConvolver,\n      setGlobalLyricOffset,\n      replacePlaylist,"
          )
          replace_once(
              player_path,
              "      omit: ['pic', 'title', 'outputDevice']",
              "      omit: ['pic', 'title', 'outputDevice', 'globalLyricOffset']"
          )

          main_path = 'src/renderer/main.ts'
          replace_once(main_path, "import { globalLyricOffset } from './utils/globalLyricOffset'\n", '')
          replace_once(
              main_path,
              """/**
 * 将持久化的全局歌词偏移同步到每一首当前歌曲。
 *
 * 详细说明：
 * 1. 应用启动后立即同步一次；
 * 2. 每次切歌时覆盖歌曲自身的 offset，使同一个偏移作用于全部歌曲；
 * 3. 用户调整全局偏移后，当前歌曲立即更新，播放器和桌面歌词共用该值。
 */
watch(
  () => [playerStore.currentTrack, globalLyricOffset.value] as const,
  ([track, offset]) => {
    if (!track || track.offset === offset) return
    track.offset = offset
  },
  { immediate: true }
)

""",
              ''
          )

          lyric_path = 'src/renderer/components/LyricPage.vue'
          replace_once(
              lyric_path,
              '<button-icon title="提前0.5s（应用于所有歌曲）" @click="setOffset(-0.5)">',
              '<button-icon title="提前0.5s；按住 Shift 精调0.1s（应用于所有歌曲）" @click="setOffset(-0.5, $event)">'
          )
          replace_once(
