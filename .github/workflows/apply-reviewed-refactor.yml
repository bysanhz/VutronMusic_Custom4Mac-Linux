          package['scripts']['vue:type-check'] = 'vue-tsc --noEmit'
          package['scripts']['format:check'] = 'prettier . --check'
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          builder_path = 'buildAssets/builder/config.js'
          builder = read(builder_path)
          if not re.search(r'(^|\n)\s*appId\s*:', builder):
              markers = ['module.exports = {\n', 'const config = {\n', 'export default {\n']
              for marker in markers:
                  if marker in builder:
                      builder = builder.replace(marker, marker + "  appId: 'com.bysanhz.vutronmusic.custom',\n", 1)
                      break
              else:
                  raise RuntimeError('Unable to locate builder config object for appId insertion')
              write(builder_path, builder)

          # 一次性工作流在最终提交中删除，避免仓库长期保留维护脚本。
