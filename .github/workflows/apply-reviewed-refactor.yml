"""
          )

          # 心动模式：增加兼容重试、桌面歌词反馈和完整初始快照。
          regex_once(
              main_path,
              r"const startHeartModeFromLikes = async \(\) => \{.*?\n\}\n\n/\*\*\n \* 使用 BroadcastChannel",
              """const publishHeartModeResult = (
  requestId: string,
  status: 'loading' | 'success' | 'error',
  message: string
