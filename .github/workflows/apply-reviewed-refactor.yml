          replace_once(play_page, '            v-show="tabs[tabIdx] !== \'comment\'"\n', '            v-show="tabs.length > 1"\n')
          regex_once(
              play_page,
              r"            :title=\"\n              tabs\[\(tabIdx \+ 1\) % tabs\.length\] === 'comment'\n                \? '查看评论'\n                : \$t\('contextMenu\.showLyric'\)\n            \"",
              '            :title="nextTabTitle"'
          )
          replace_once(
              play_page,
              """const switchCurrentTab = () => {
  tabIdx.value = (tabIdx.value + 1) % tabs.value.length
}

const getIcon = () => {
  if (tabs.value[tabIdx.value] === 'pickLyric') {
    return 'lyric-half'
  } else if (tabs.value[tabIdx.value] === 'fullLyric') {
    return 'comment'
  } else {
