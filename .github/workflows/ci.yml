name: Code Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, type check, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies without native rebuild
        run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 600000

      - name: Apply compact OSD spacing fix
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('src/renderer/assets/css/osdlyric.scss')
          css = css_path.read_text(encoding='utf-8')
          css = css.replace(
              "#main.compact-mode .compact-osd-layout {\n  column-gap: 8px !important;\n}",
              "#main.compact-mode .compact-osd-layout {\n  grid-template-columns: 35px minmax(0, 1fr) !important;\n  column-gap: 2px !important;\n  justify-content: start;\n}",
          )
          css = css.replace(
              "  transform: translateX(4px);\n}",
              "  transform: none;\n  margin: 0;\n}\n\nhtml:not(.osd-cover-controls-hidden) #main.compact-mode .compact-lyric-panel .container.mini,\nhtml:not(.osd-cover-controls-hidden) #main.compact-mode .compact-lyric-panel .container.mini .lyric {\n  text-align: left !important;\n}",
          )
          css_path.write_text(css, encoding='utf-8')

          preview_path = Path('src/renderer/utils/osdPresetTransferPreview.ts')
          preview = preview_path.read_text(encoding='utf-8')
          old = """  'builtin-cover': {\n    ...COMMON_BUILTIN_SETTINGS,\n    type: 'small',\n    mode: 'twoLines',\n    translationMode: 'tlyric',\n    align: 'center',\n    coverControlsVisible: true\n  }"""
          new = """  'builtin-cover': {\n    ...COMMON_BUILTIN_SETTINGS,\n    type: 'small',\n    mode: 'twoLines',\n    translationMode: 'tlyric',\n    align: 'left',\n    coverControlsVisible: true\n  }"""
          if old not in preview:
              raise SystemExit('builtin-cover preview preset block not found')
          preview_path.write_text(preview.replace(old, new), encoding='utf-8')

          test_path = Path('tests/feature-regression.spec.ts')
          tests = test_path.read_text(encoding='utf-8')
          marker = "test.describe('compact desktop lyric spacing', () => {"
          if marker not in tests:
              tests += """

          test.describe('compact desktop lyric spacing', () => {
            test('keeps cover controls flush left and lyrics adjacent', () => {
              const osdCss = readSource('src/renderer/assets/css/osdlyric.scss')
              const preview = readSource('src/renderer/utils/osdPresetTransferPreview.ts')

              expect(osdCss).toContain('column-gap: 2px !important;')
              expect(osdCss).toContain('transform: none;')
              expect(osdCss).toContain('html:not(.osd-cover-controls-hidden)')
              expect(osdCss).toContain('text-align: left !important;')
              expect(preview).toMatch(/'builtin-cover': \\{[\\s\\S]*?align: 'left'/)
            })
          })
          """
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Format patched files
        run: >-
          yarn prettier src/renderer/assets/css/osdlyric.scss src/renderer/utils/osdPresetTransferPreview.ts tests/feature-regression.spec.ts .github/workflows/ci.yml --write

      - name: Commit compact OSD spacing fix
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- src/renderer/assets/css/osdlyric.scss src/renderer/utils/osdPresetTransferPreview.ts tests/feature-regression.spec.ts; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/renderer/assets/css/osdlyric.scss src/renderer/utils/osdPresetTransferPreview.ts tests/feature-regression.spec.ts
          git commit -m 'fix: tighten compact desktop lyric spacing'
          git push origin HEAD:${{ github.head_ref }}

      - name: Check formatting
        run: yarn run format:check

      - name: Lint source
        run: yarn lint

      - name: Type check
        run: yarn run vue:type-check

      - name: Run security and feature regression tests
        run: >-
          yarn playwright test tests/security-hardening.spec.ts tests/feature-regression.spec.ts

      - name: Build renderer and main process
        run: yarn vite --config vite.config.ts build
