name: Code Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, type check, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies without native rebuild
        run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 600000

      - name: Diagnose Library formatting
        run: |
          cp src/renderer/views/LibraryMusic.vue /tmp/LibraryMusic.before.vue
          yarn prettier src/renderer/views/LibraryMusic.vue --write
          diff -u /tmp/LibraryMusic.before.vue src/renderer/views/LibraryMusic.vue || true
          cp /tmp/LibraryMusic.before.vue src/renderer/views/LibraryMusic.vue

      - name: Check formatting
        run: yarn run format:check

      - name: Lint source
        if: ${{ always() }}
        run: yarn lint

      - name: Type check
        if: ${{ always() }}
        run: yarn run vue:type-check

      - name: Run security and feature regression tests
        if: ${{ always() }}
        run: >-
          yarn playwright test tests/security-hardening.spec.ts tests/feature-regression.spec.ts tests/netease-scrobble-lifecycle.spec.ts

      - name: Build renderer and main process
        if: ${{ always() }}
        run: yarn vite --config vite.config.ts build
