name: Code Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, type check, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies without native rebuild
        run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 600000

      - name: Format insights patch and print diff
        run: |
          yarn prettier src/renderer/components/InsightsResourceGrid.vue src/renderer/components/InsightsTrackList.vue src/renderer/views/MusicInsightsStable.vue tests/music-insights-stability.spec.ts --write
          git diff -- src/renderer/components/InsightsResourceGrid.vue src/renderer/components/InsightsTrackList.vue src/renderer/views/MusicInsightsStable.vue tests/music-insights-stability.spec.ts

      - name: Check formatting
        run: yarn run format:check

      - name: Lint source
        run: yarn lint

      - name: Type check
        run: yarn run vue:type-check

      - name: Run security and feature regression tests
        run: >-
          yarn playwright test tests/security-hardening.spec.ts tests/feature-regression.spec.ts tests/music-insights-stability.spec.ts

      - name: Build renderer and main process
        run: yarn vite --config vite.config.ts build
