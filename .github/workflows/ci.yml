name: Code Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, type check, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies without native rebuild
        run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 600000

      - name: Apply outer-scroll windowing patch
        run: python scripts/apply_outer_scroll_windowing.py

      - name: Format generated patch
        run: >-
          yarn prettier src/renderer/components/VirtualScrollNoHeight.vue tests/feature-regression.spec.ts .github/workflows/ci.yml --write

      - name: Commit generated patch
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/renderer/components/VirtualScrollNoHeight.vue tests/feature-regression.spec.ts .github/workflows/ci.yml
          git commit -m 'fix: window outer-scrolling cover grids'
          git push origin HEAD:${{ github.head_ref }}

      - name: Check formatting
        run: yarn run format:check

      - name: Lint source
        run: yarn lint

      - name: Type check
        run: yarn run vue:type-check

      - name: Run security and feature regression tests
        run: >-
          yarn playwright test tests/security-hardening.spec.ts tests/feature-regression.spec.ts

      - name: Build renderer and main process
        run: yarn vite --config vite.config.ts build
