name: Code Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, type check, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies without native rebuild
        run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 600000

      - name: Format i18n audit files and push
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          yarn prettier src/renderer/components/CommentFloor.vue src/renderer/components/CommentList.vue src/renderer/components/ModalAccurateMatch.vue src/renderer/components/ModalAddTrackToPlaylist.vue src/renderer/components/ModalEditPlaylist.vue src/renderer/components/ModalNewPlaylist.vue src/renderer/components/ModalPlayerTheme.vue src/renderer/components/ModalSaveTheme.vue src/renderer/components/NavBar.vue src/renderer/components/PlayerBar.vue src/renderer/components/SearchBox.vue src/renderer/components/SideNav.vue src/renderer/components/VirtualTrackList.vue src/renderer/components/WriteComment.vue src/renderer/locales/en.json src/renderer/locales/zh-hans.json src/renderer/locales/zh-hant.json src/renderer/views/AlbumPage.vue src/renderer/views/ArtistMv.vue src/renderer/views/DailyTracks.vue src/renderer/views/ExplorePage.vue src/renderer/views/HomePage.vue src/renderer/views/LibraryMusic.vue src/renderer/views/LocalMusic.vue src/renderer/views/LoginAccount.vue src/renderer/views/MusicInsightsStable.vue src/renderer/views/MvPage.vue src/renderer/views/NextUp.vue src/renderer/views/OSDLyric.vue src/renderer/views/PlaylistPage.vue src/renderer/views/SearchPage.vue src/renderer/views/StreamLogin.vue src/renderer/views/StreamPage.vue src/renderer/views/SystemSettings.vue src/renderer/views/UserPage.vue tests/i18n-coverage.spec.ts --write
          if git diff --quiet -- src/renderer/components/CommentFloor.vue src/renderer/components/CommentList.vue src/renderer/components/ModalAccurateMatch.vue src/renderer/components/ModalAddTrackToPlaylist.vue src/renderer/components/ModalEditPlaylist.vue src/renderer/components/ModalNewPlaylist.vue src/renderer/components/ModalPlayerTheme.vue src/renderer/components/ModalSaveTheme.vue src/renderer/components/NavBar.vue src/renderer/components/PlayerBar.vue src/renderer/components/SearchBox.vue src/renderer/components/SideNav.vue src/renderer/components/VirtualTrackList.vue src/renderer/components/WriteComment.vue src/renderer/locales/en.json src/renderer/locales/zh-hans.json src/renderer/locales/zh-hant.json src/renderer/views/AlbumPage.vue src/renderer/views/ArtistMv.vue src/renderer/views/DailyTracks.vue src/renderer/views/ExplorePage.vue src/renderer/views/HomePage.vue src/renderer/views/LibraryMusic.vue src/renderer/views/LocalMusic.vue src/renderer/views/LoginAccount.vue src/renderer/views/MusicInsightsStable.vue src/renderer/views/MvPage.vue src/renderer/views/NextUp.vue src/renderer/views/OSDLyric.vue src/renderer/views/PlaylistPage.vue src/renderer/views/SearchPage.vue src/renderer/views/StreamLogin.vue src/renderer/views/StreamPage.vue src/renderer/views/SystemSettings.vue src/renderer/views/UserPage.vue tests/i18n-coverage.spec.ts; then
            echo "No i18n formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/components/CommentFloor.vue src/renderer/components/CommentList.vue src/renderer/components/ModalAccurateMatch.vue src/renderer/components/ModalAddTrackToPlaylist.vue src/renderer/components/ModalEditPlaylist.vue src/renderer/components/ModalNewPlaylist.vue src/renderer/components/ModalPlayerTheme.vue src/renderer/components/ModalSaveTheme.vue src/renderer/components/NavBar.vue src/renderer/components/PlayerBar.vue src/renderer/components/SearchBox.vue src/renderer/components/SideNav.vue src/renderer/components/VirtualTrackList.vue src/renderer/components/WriteComment.vue src/renderer/locales/en.json src/renderer/locales/zh-hans.json src/renderer/locales/zh-hant.json src/renderer/views/AlbumPage.vue src/renderer/views/ArtistMv.vue src/renderer/views/DailyTracks.vue src/renderer/views/ExplorePage.vue src/renderer/views/HomePage.vue src/renderer/views/LibraryMusic.vue src/renderer/views/LocalMusic.vue src/renderer/views/LoginAccount.vue src/renderer/views/MusicInsightsStable.vue src/renderer/views/MvPage.vue src/renderer/views/NextUp.vue src/renderer/views/OSDLyric.vue src/renderer/views/PlaylistPage.vue src/renderer/views/SearchPage.vue src/renderer/views/StreamLogin.vue src/renderer/views/StreamPage.vue src/renderer/views/SystemSettings.vue src/renderer/views/UserPage.vue tests/i18n-coverage.spec.ts
          git commit -m "style: format i18n audit changes"
          git push origin HEAD:${{ github.head_ref }}

      - name: Check formatting
        run: yarn run format:check

      - name: Lint source
        if: ${{ always() }}
        run: yarn lint

      - name: Type check
        if: ${{ always() }}
        run: yarn run vue:type-check

      - name: Run security and feature regression tests
        if: ${{ always() }}
        run: >-
          yarn playwright test tests/security-hardening.spec.ts tests/feature-regression.spec.ts tests/netease-scrobble-lifecycle.spec.ts

      - name: Build renderer and main process
        if: ${{ always() }}
        run: yarn vite --config vite.config.ts build
