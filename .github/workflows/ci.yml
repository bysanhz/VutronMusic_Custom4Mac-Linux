name: Code Quality

on:
  push:
    branches:
      - fix/library-state-and-render-freeze
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Patch, lint, type check, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies without native rebuild
        run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 600000

      - name: Repair library hydration and bound cover rendering
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  if new in text:
                      return text
                  raise SystemExit(f'missing replacement target: {label}')
              return text.replace(old, new, 1)

          path = Path('src/renderer/store/data.ts')
          text = path.read_text()
          text = replace_once(text, "import { ref, reactive } from 'vue'", "import { ref } from 'vue'", 'data import')

          marker = 'interface LikedState {'
          if marker not in text:
              insert_at = text.index('\n\nexport const useDataStore')
              helpers = r'''

interface LikedState {
  songs: number[]
  songsWithDetails: any[]
  playlists: any[]
  albums: any[]
  artists: any[]
  mvs: any[]
  cloudDisk: any[]
  playHistory: {
    weekData: any[]
    allData: any[]
  }
}

const createDefaultLikedState = (): LikedState => ({
  songs: [],
  songsWithDetails: [],
  playlists: [],
  albums: [],
  artists: [],
  mvs: [],
  cloudDisk: [],
  playHistory: {
    weekData: [],
    allData: []
  }
})

const normalizeLikedState = (value: any): LikedState => ({
  songs: normalizeTrackIDs(Array.isArray(value?.songs) ? value.songs : []),
  songsWithDetails: Array.isArray(value?.songsWithDetails) ? value.songsWithDetails : [],
  playlists: Array.isArray(value?.playlists) ? value.playlists : [],
  albums: Array.isArray(value?.albums) ? value.albums : [],
  artists: Array.isArray(value?.artists) ? value.artists : [],
  mvs: Array.isArray(value?.mvs) ? value.mvs : [],
  cloudDisk: Array.isArray(value?.cloudDisk) ? value.cloudDisk : [],
  playHistory: {
    weekData: Array.isArray(value?.playHistory?.weekData) ? value.playHistory.weekData : [],
    allData: Array.isArray(value?.playHistory?.allData) ? value.playHistory.allData : []
  }
})
'''
              text = text[:insert_at] + helpers + text[insert_at:]

          old_decl_start = '    const liked = reactive<{'
          if old_decl_start in text:
              start = text.index(old_decl_start)
              end = text.index('\n\n    const { showToast }', start)
              text = text[:start] + '    const liked = ref<LikedState>(createDefaultLikedState())' + text[end:]

          body_start = text.index('    const { showToast }')
          body_end = text.index('\n\n    return {', body_start)
          body = text[body_start:body_end].replace('liked.', 'liked.value.')
          text = text[:body_start] + body + text[body_end:]

          persist_old = """    persist: {\n      pick: ['user', 'likedSongPlaylistID', 'lastRefreshCookieDate', 'loginMode', 'liked.songs']\n    }"""
          persist_new = """    persist: {\n      afterHydrate: ({ store }) => {\n        const hydratedStore = store as unknown as { liked?: unknown }\n        hydratedStore.liked = normalizeLikedState(hydratedStore.liked)\n      },\n      pick: ['user', 'likedSongPlaylistID', 'lastRefreshCookieDate', 'loginMode', 'liked.songs']\n    }"""
          text = replace_once(text, persist_old, persist_new, 'liked hydration normalization')
          path.write_text(text)

          path = Path('src/renderer/views/LibraryMusic.vue')
          text = path.read_text()

          template_end = text.index('</template>')
          template = text[:template_end].replace('liked.', 'libraryData.')
          text = template + text[template_end:]
          text = text.replace('<div v-show="currentTab ===', '<div v-if="currentTab ===')

          text = replace_once(text, ':items="filterPlaylists"', ':items="visiblePlaylists"', 'visible playlists')
          text = replace_once(
              text,
              '''            :enable-virtual-scroll="false"\n            :is-end="true"\n            :padding-bottom="96"\n          />''',
              '''            :enable-virtual-scroll="false"\n            :is-end="visiblePlaylists.length >= filterPlaylists.length"\n            :padding-bottom="96"\n            :load-more="loadMorePlaylists"\n          />''',
              'playlist local paging'
          )
          text = replace_once(text, ':items="libraryData.albums"', ':items="visibleAlbums"', 'visible albums')
          text = replace_once(
              text,
              '''            :enable-virtual-scroll="false"\n            :is-end="true"\n            :padding-bottom="96"\n          />''',
              '''            :enable-virtual-scroll="false"\n            :is-end="visibleAlbums.length >= libraryData.albums.length"\n            :padding-bottom="96"\n            :load-more="loadMoreAlbums"\n          />''',
              'album local paging'
          )
          text = replace_once(text, ':items="libraryData.artists"', ':items="visibleArtists"', 'visible artists')
          text = replace_once(
              text,
              '''            :enable-virtual-scroll="false"\n            :is-end="true"\n            :padding-bottom="96"\n          />''',
              '''            :enable-virtual-scroll="false"\n            :is-end="visibleArtists.length >= libraryData.artists.length"\n            :padding-bottom="96"\n            :load-more="loadMoreArtists"\n          />''',
              'artist local paging'
          )

          text = text.replace(
              "import { ref, computed, onMounted, onUnmounted, inject, nextTick } from 'vue'",
              "import { ref, computed, onMounted, onUnmounted, inject, nextTick, watch } from 'vue'"
          )

          script_start = text.index('<script setup lang="ts">')
          script_end = text.index('</script>', script_start)
          script = text[script_start:script_end].replace('liked.value', 'libraryData.value')
          text = text[:script_start] + script + text[script_end:]

          anchor = '''const tabsRowRef = ref()\n\nconst hasCustomTitleBar'''
          view_model = '''const tabsRowRef = ref()\n\nconst libraryData = computed(() => {\n  const value = liked.value\n  return {\n    songs: Array.isArray(value?.songs) ? value.songs : [],\n    songsWithDetails: Array.isArray(value?.songsWithDetails) ? value.songsWithDetails : [],\n    playlists: Array.isArray(value?.playlists) ? value.playlists : [],\n    albums: Array.isArray(value?.albums) ? value.albums : [],\n    artists: Array.isArray(value?.artists) ? value.artists : [],\n    mvs: Array.isArray(value?.mvs) ? value.mvs : [],\n    cloudDisk: Array.isArray(value?.cloudDisk) ? value.cloudDisk : [],\n    playHistory: {\n      weekData: Array.isArray(value?.playHistory?.weekData) ? value.playHistory.weekData : [],\n      allData: Array.isArray(value?.playHistory?.allData) ? value.playHistory.allData : []\n    }\n  }\n})\n\nconst COVER_PAGE_SIZE = 40\nconst playlistVisibleLimit = ref(COVER_PAGE_SIZE)\nconst albumVisibleLimit = ref(COVER_PAGE_SIZE)\nconst artistVisibleLimit = ref(COVER_PAGE_SIZE)\n\nconst hasCustomTitleBar'''
          text = replace_once(text, anchor, view_model, 'library null-safe view model')

          filter_end = '''  return playlists\n})\n\nconst playHistoryList = computed'''
          paging = '''  return playlists\n})\n\nconst visiblePlaylists = computed(() =>\n  filterPlaylists.value.slice(0, playlistVisibleLimit.value)\n)\nconst visibleAlbums = computed(() =>\n  libraryData.value.albums.slice(0, albumVisibleLimit.value)\n)\nconst visibleArtists = computed(() =>\n  libraryData.value.artists.slice(0, artistVisibleLimit.value)\n)\n\nconst loadMorePlaylists = () => {\n  playlistVisibleLimit.value = Math.min(\n    filterPlaylists.value.length,\n    playlistVisibleLimit.value + COVER_PAGE_SIZE\n  )\n}\nconst loadMoreAlbums = () => {\n  albumVisibleLimit.value = Math.min(\n    libraryData.value.albums.length,\n    albumVisibleLimit.value + COVER_PAGE_SIZE\n  )\n}\nconst loadMoreArtists = () => {\n  artistVisibleLimit.value = Math.min(\n    libraryData.value.artists.length,\n    artistVisibleLimit.value + COVER_PAGE_SIZE\n  )\n}\n\nwatch(playlistFilter, () => {\n  playlistVisibleLimit.value = COVER_PAGE_SIZE\n})\n\nconst playHistoryList = computed'''
          text = replace_once(text, filter_end, paging, 'library cover paging')

          old_tail = '''  fetchLikedAlbums()\n  fetchLikedArtists()\n  fetchLikedMVs()\n  fetchPlayHistory()\n  fetchCloudDisk()\n}'''
          new_tail = '''  void Promise.allSettled([\n    Promise.resolve().then(() => fetchLikedAlbums()),\n    Promise.resolve().then(() => fetchLikedArtists()),\n    Promise.resolve().then(() => fetchLikedMVs()),\n    Promise.resolve().then(() => fetchPlayHistory()),\n    Promise.resolve().then(() => fetchCloudDisk())\n  ])\n}'''
          text = replace_once(text, old_tail, new_tail, 'background library loads')
          text = replace_once(
              text,
              '''  loadData()\n  dailyTask()''',
              '''  void loadData().catch((error) => {\n    console.error('[Library] 加载音乐库失败:', error)\n    tricklingProgress.done()\n    show.value = true\n  })\n  dailyTask()''',
              'library load rejection guard'
          )
          path.write_text(text)

          path = Path('tests/feature-regression.spec.ts')
          text = path.read_text()
          marker = "test.describe('library hydration and bounded rendering'"
          if marker not in text:
              text += r'''

test.describe('library hydration and bounded rendering', () => {
  test('repairs nullable persisted liked state and avoids mounting unbounded hidden cover grids', () => {
    const dataStore = readSource('src/renderer/store/data.ts')
    const library = readSource('src/renderer/views/LibraryMusic.vue')

    expect(dataStore).toContain('const liked = ref<LikedState>(createDefaultLikedState())')
    expect(dataStore).toContain('afterHydrate: ({ store }) =>')
    expect(dataStore).toContain('normalizeLikedState(hydratedStore.liked)')
    expect(library).toContain('const libraryData = computed(() =>')
    expect(library).toContain('const COVER_PAGE_SIZE = 40')
    expect(library).toContain(':items="visiblePlaylists"')
    expect(library).toContain(':items="visibleAlbums"')
    expect(library).toContain(':items="visibleArtists"')
    expect(library).toContain('v-if="currentTab === \'playlist\'"')
    expect(library).toContain('Promise.allSettled([')
    expect(library).toContain("console.error('[Library] 加载音乐库失败:', error)")
  })
})
'''
          path.write_text(text)
          PY

          yarn prettier \
            src/renderer/store/data.ts \
            src/renderer/views/LibraryMusic.vue \
            tests/feature-regression.spec.ts \
            .github/workflows/ci.yml \
            --write

      - name: Check formatting
        run: yarn run format:check

      - name: Lint source
        run: yarn lint

      - name: Type check
        run: yarn run vue:type-check

      - name: Run security and feature regression tests
        run: >-
          yarn playwright test tests/security-hardening.spec.ts tests/feature-regression.spec.ts

      - name: Build renderer and main process
        run: yarn vite --config vite.config.ts build

      - name: Persist generated fixes
        run: |
          if git diff --quiet -- \
            src/renderer/store/data.ts \
            src/renderer/views/LibraryMusic.vue \
            tests/feature-regression.spec.ts; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/renderer/store/data.ts \
            src/renderer/views/LibraryMusic.vue \
            tests/feature-regression.spec.ts
          git commit -m "fix: stabilize library hydration and cover rendering"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
