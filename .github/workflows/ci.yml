name: Code Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, type check, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies without native rebuild
        run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 600000

      - name: Apply native cover rendering fix
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          virtual_path = Path('src/renderer/components/VirtualScrollNoHeight.vue')
          text = virtual_path.read_text(encoding='utf-8')

          text = re.sub(
              r"/\*\*\n \* When nested scrolling is disabled.*?const anchorPoint = computed",
              "const contentTransform = computed(() => `translateY(${startOffset.value}px)`)\nconst anchorPoint = computed",
              text,
              flags=re.S,
          )

          text = re.sub(
              r"const visibleCount = computed\(\(\) =>\n  Math\.max\(.*?\n\)\nconst endRow",
              "const visibleCount = computed(() => Math.floor(containerHeight.value / itemSize.value))\nconst endRow",
              text,
              flags=re.S,
          )

          text = re.sub(
              r"const updateOuterWindow = \(\) => \{.*?\n\}\n\nconst parentScrollEvent = rafThrottle\(\(\) => \{",
              "const parentScrollEvent = rafThrottle(() => {\n  if (!props.enableVirtualScroll) return",
              text,
              flags=re.S,
          )
          text = text.replace("\n  updateOuterWindow()\n", "\n")

          old_bind = """const bindParentScrollListener = () => {\n  const nextElement = mainRef.value ?? null\n  if (parentScrollElement === nextElement) return\n  parentScrollElement?.removeEventListener('scroll', parentScrollEvent)\n  parentScrollElement = nextElement\n  parentScrollElement?.addEventListener('scroll', parentScrollEvent, { passive: true })\n  parentScrollEvent()\n}"""
          new_bind = """const bindParentScrollListener = () => {\n  if (!props.enableVirtualScroll) {\n    unbindParentScrollListener()\n    return\n  }\n  const nextElement = mainRef.value ?? null\n  if (parentScrollElement === nextElement) return\n  parentScrollElement?.removeEventListener('scroll', parentScrollEvent)\n  parentScrollElement = nextElement\n  parentScrollElement?.addEventListener('scroll', parentScrollEvent, { passive: true })\n  parentScrollEvent()\n}"""
          if old_bind not in text:
              raise SystemExit('bindParentScrollListener block not found')
          text = text.replace(old_bind, new_bind)

          old_observer = """const observeLoadMoreSentinel = () => {\n  if (!props.enableVirtualScroll) return\n  loadMoreObserver?.disconnect()\n  const element = getListElement()\n  const sentinel = loadMoreSentinelRef.value\n  if (!element || !(sentinel instanceof Element)) return\n\n  loadMoreObserver = new IntersectionObserver(\n    (entries) => {\n      if (entries.some((entry) => entry.isIntersecting)) {\n        void requestLoadMore()\n      }\n    },\n    {\n      root: element,\n      rootMargin: '0px 0px 640px 0px',\n      threshold: 0\n    }\n  )\n  loadMoreObserver.observe(sentinel)\n}"""
          new_observer = """const observeLoadMoreSentinel = () => {\n  loadMoreObserver?.disconnect()\n  const element = getListElement()\n  const sentinel = loadMoreSentinelRef.value\n  const root = props.enableVirtualScroll ? element : mainRef.value\n  if (!element || !root || !(sentinel instanceof Element)) return\n\n  loadMoreObserver = new IntersectionObserver(\n    (entries) => {\n      if (entries.some((entry) => entry.isIntersecting)) {\n        void requestLoadMore()\n      }\n    },\n    {\n      root,\n      rootMargin: props.enableVirtualScroll ? '0px 0px 640px 0px' : '0px 0px 720px 0px',\n      threshold: 0\n    }\n  )\n  loadMoreObserver.observe(sentinel)\n}"""
          if old_observer not in text:
              raise SystemExit('load more observer block not found')
          text = text.replace(old_observer, new_observer)

          text = text.replace(
              "    if (props.enableVirtualScroll) observeLoadMoreSentinel()\n    bindParentScrollListener()",
              "    observeLoadMoreSentinel()\n    bindParentScrollListener()",
          )

          old_updated = """onUpdated(() => {\n  nextTick(() => {\n    if (props.enableVirtualScroll) {\n      updateItemsSize()\n      setStartOffset()\n    } else {\n      parentScrollEvent()\n    }\n  })\n})"""
          new_updated = """onUpdated(() => {\n  if (!props.enableVirtualScroll) return\n  nextTick(() => {\n    updateItemsSize()\n    setStartOffset()\n  })\n})"""
          if old_updated not in text:
              raise SystemExit('onUpdated windowing block not found')
          text = text.replace(old_updated, new_updated)

          text = text.replace(
              "    setTimeout(() => {\n      updateItemsSize()\n    }, 100)",
              "    if (props.enableVirtualScroll) {\n      setTimeout(() => {\n        updateItemsSize()\n      }, 100)\n    }",
          )
          virtual_path.write_text(text, encoding='utf-8')

          cover_row_path = Path('src/renderer/components/VirtualCoverRow.vue')
          cover_row = cover_row_path.read_text(encoding='utf-8')
          needle = """.cover-item {\n  color: var(--color-text);\n  padding-bottom: 20px;\n  min-width: 0;\n}"""
          replacement = """.cover-item {\n  color: var(--color-text);\n  padding-bottom: 20px;\n  min-width: 0;\n  content-visibility: auto;\n  contain-intrinsic-size: auto 280px;\n}"""
          if needle not in cover_row:
              raise SystemExit('cover-item style block not found')
          cover_row_path.write_text(cover_row.replace(needle, replacement), encoding='utf-8')

          cover_box_path = Path('src/renderer/components/CoverBox.vue')
          cover_box = cover_box_path.read_text(encoding='utf-8')
          old_img = '<img :src="imageUrl" :style="imageStyles" loading="lazy" />'
          new_img = '<img :src="imageUrl" :style="imageStyles" loading="lazy" decoding="async" />'
          if old_img not in cover_box:
              raise SystemExit('cover image tag not found')
          cover_box_path.write_text(cover_box.replace(old_img, new_img), encoding='utf-8')

          test_path = Path('tests/feature-regression.spec.ts')
          tests = test_path.read_text(encoding='utf-8')
          tests = re.sub(
              r"\n?test\.describe\('outer-scroll cover virtualization'.*?\n\}\)\n?",
              "\n",
              tests,
              flags=re.S,
          )
          marker = "test.describe('native outer-scroll cover rendering', () => {"
          if marker not in tests:
              tests += """

          test.describe('native outer-scroll cover rendering', () => {
            test('avoids per-frame JS windowing while skipping offscreen cover work', () => {
              const virtualScroll = readSource('src/renderer/components/VirtualScrollNoHeight.vue')
              const coverRow = readSource('src/renderer/components/VirtualCoverRow.vue')
              const coverBox = readSource('src/renderer/components/CoverBox.vue')

              expect(virtualScroll).not.toContain('const updateOuterWindow = () =>')
              expect(virtualScroll).not.toContain('const outerViewportHeight = computed(() =>')
              expect(virtualScroll).toContain(
                'const root = props.enableVirtualScroll ? element : mainRef.value'
              )
              expect(virtualScroll).toContain('if (!props.enableVirtualScroll) return')
              expect(coverRow).toContain('content-visibility: auto;')
              expect(coverRow).toContain('contain-intrinsic-size: auto 280px;')
              expect(coverBox).toContain('decoding="async"')
            })
          })
          """
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Format patched files
        run: >-
          yarn prettier src/renderer/components/VirtualScrollNoHeight.vue src/renderer/components/VirtualCoverRow.vue src/renderer/components/CoverBox.vue tests/feature-regression.spec.ts .github/workflows/ci.yml --write

      - name: Commit native rendering fix
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- src/renderer/components/VirtualScrollNoHeight.vue src/renderer/components/VirtualCoverRow.vue src/renderer/components/CoverBox.vue tests/feature-regression.spec.ts; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/renderer/components/VirtualScrollNoHeight.vue src/renderer/components/VirtualCoverRow.vue src/renderer/components/CoverBox.vue tests/feature-regression.spec.ts
          git commit -m 'fix: use native rendering for outer-scrolling cover grids'
          git push origin HEAD:${{ github.head_ref }}

      - name: Check formatting
        run: yarn run format:check

      - name: Lint source
        run: yarn lint

      - name: Type check
        run: yarn run vue:type-check

      - name: Run security and feature regression tests
        run: >-
          yarn playwright test tests/security-hardening.spec.ts tests/feature-regression.spec.ts

      - name: Build renderer and main process
        run: yarn vite --config vite.config.ts build
