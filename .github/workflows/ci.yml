name: Code Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, type check, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies without native rebuild
        run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 600000

      - name: Update native rendering regression expectation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/feature-regression.spec.ts')
          text = path.read_text(encoding='utf-8')
          old = '''expect(virtualScroll).toContain("rootMargin: '0px 0px 640px 0px'")'''
          new = '''expect(virtualScroll).toContain(
            "rootMargin: props.enableVirtualScroll ? '0px 0px 640px 0px' : '0px 0px 720px 0px'"
          )'''
          if old not in text:
              raise SystemExit('stale rootMargin expectation not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Format patched regression test
        run: >-
          yarn prettier tests/feature-regression.spec.ts .github/workflows/ci.yml --write

      - name: Commit patched regression test
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- tests/feature-regression.spec.ts; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/feature-regression.spec.ts
          git commit -m 'test: update native cover rendering expectation'
          git push origin HEAD:${{ github.head_ref }}

      - name: Check formatting
        run: yarn run format:check

      - name: Lint source
        run: yarn lint

      - name: Type check
        run: yarn run vue:type-check

      - name: Run security and feature regression tests
        run: >-
          yarn playwright test tests/security-hardening.spec.ts tests/feature-regression.spec.ts

      - name: Build renderer and main process
        run: yarn vite --config vite.config.ts build
