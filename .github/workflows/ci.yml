name: Code Quality

on:
  push:
    branches:
      - fix/library-state-and-render-freeze
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Patch, lint, type check, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies without native rebuild
        run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 600000

      - name: Repair library hydration and bound cover rendering
        run: python .github/scripts/patch_library_fix.py

      - name: Format generated changes
        run: >-
          yarn prettier src/renderer/store/data.ts src/renderer/views/LibraryMusic.vue tests/feature-regression.spec.ts .github/workflows/ci.yml --write

      - name: Check formatting
        run: yarn run format:check

      - name: Lint source
        run: yarn lint

      - name: Type check
        run: yarn run vue:type-check

      - name: Run security and feature regression tests
        run: >-
          yarn playwright test tests/security-hardening.spec.ts tests/feature-regression.spec.ts

      - name: Build renderer and main process
        run: yarn vite --config vite.config.ts build

      - name: Persist generated fixes
        run: |
          if git diff --quiet -- \
            src/renderer/store/data.ts \
            src/renderer/views/LibraryMusic.vue \
            tests/feature-regression.spec.ts; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/renderer/store/data.ts \
            src/renderer/views/LibraryMusic.vue \
            tests/feature-regression.spec.ts
          git commit -m "fix: stabilize library hydration and cover rendering"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
