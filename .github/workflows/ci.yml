name: Update OSD regression assertion

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Update stale regression assertion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/feature-regression.spec.ts')
          text = path.read_text()
          old = "expect(osd).toContain('    35px\\n    minmax(0, 1fr)')"
          new = """expect(osd).toContain('grid-template-columns: 35px minmax(0, 1fr);')
              expect(osd).toContain(\"'has-cover-controls': isCompactMode && coverControlsVisible\")
              expect(osd).toContain('text-align: left !important;')"""
          if old not in text:
              raise SystemExit('stale OSD assertion not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit test update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/feature-regression.spec.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No test changes to commit"
            exit 0
          fi
          git commit -m "test: update compact OSD layout assertion"
          git push origin HEAD:${{ github.head_ref }}