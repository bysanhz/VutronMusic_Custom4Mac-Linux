name: Code Quality

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, type check, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies without native rebuild
        run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 600000

      - name: Apply virtual list player inset fix
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing target in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'src/renderer/App.vue',
              '''const PLAYER_SAFE_BOTTOM = 120\nconst mainStyle = computed(() => {\n  const safeBottom = enabled.value && showPlayerBar.value ? PLAYER_SAFE_BOTTOM : 0''',
              '''const PLAYER_BAR_HEIGHT = 64\nconst PLAYER_SAFE_BOTTOM = 120\nconst playerBarInset = computed(() =>\n  enabled.value && showPlayerBar.value ? PLAYER_BAR_HEIGHT : 0\n)\nconst mainStyle = computed(() => {\n  const safeBottom = playerBarInset.value ? PLAYER_SAFE_BOTTOM : 0'''
          )

          replace_once(
              'src/renderer/App.vue',
              '''provide('navBarRef', navBarRef)\n\nprovide('appearance', appearance)''',
              '''provide('navBarRef', navBarRef)\nprovide('playerBarInset', playerBarInset)\n\nprovide('appearance', appearance)'''
          )

          replace_once(
              'src/renderer/components/VirtualScrollNoHeight.vue',
              '''const hasCustomTitleBar = inject('hasCustomTitleBar', ref(true))\nconst mainRef = inject('mainRef', ref<HTMLElement>())''',
              '''const hasCustomTitleBar = inject('hasCustomTitleBar', ref(true))\nconst playerBarInset = inject('playerBarInset', computed(() => 0))\nconst mainRef = inject('mainRef', ref<HTMLElement>())'''
          )

          replace_once(
              'src/renderer/components/VirtualScrollNoHeight.vue',
              '''  const navBarHeight = hasCustomTitleBar.value ? 84 : 64\n  const winHeight = windowHeight.value - navBarHeight\n  const height = props.height || winHeight''',
              '''  const navBarHeight = hasCustomTitleBar.value ? 84 : 64\n  const winHeight = Math.max(0, windowHeight.value - navBarHeight - playerBarInset.value)\n  const height = props.height || winHeight'''
          )

          replace_once(
              'src/renderer/components/VirtualScrollNoHeight.vue',
              '''  if (scrollTop + containerHeight >= contentHeight) {\n    props.loadMore()\n  }''',
              '''  const loadMoreThreshold = Math.min(96, Math.max(24, containerHeight * 0.12))\n  if (scrollTop + containerHeight >= contentHeight - loadMoreThreshold) {\n    props.loadMore()\n  }'''
          )

          replace_once(
              'src/renderer/components/ScrollBar.vue',
              '''const verticalShow = ref(false)\nconst verticalActive = ref(false)\nconst isVerticalDragging = ref(false)\nconst verticalTrackBottom = ref(0)''',
              '''const verticalShow = ref(false)\nconst verticalActive = ref(false)\nconst isVerticalDragging = ref(false)\nconst viewportHeight = ref(window.innerHeight)\nconst verticalTrackBottom = ref(0)'''
          )

          replace_once(
              'src/renderer/components/ScrollBar.vue',
              '''const verticalTrackHeight = computed(() =>\n  Math.max(0, clientHeight.value - marginTop.value - verticalTrackBottom.value)\n)''',
              '''const verticalTrackHeight = computed(() =>\n  Math.max(0, viewportHeight.value - marginTop.value - verticalTrackBottom.value)\n)'''
          )

          replace_once(
              'src/renderer/components/ScrollBar.vue',
              '''  horizontalScrollLeft.value = mainElement.scrollLeft\n  horizontalScrollWidth.value = mainElement.scrollWidth''',
              '''  viewportHeight.value = window.innerHeight\n  horizontalScrollLeft.value = mainElement.scrollLeft\n  horizontalScrollWidth.value = mainElement.scrollWidth'''
          )
          PY

          yarn prettier \
            src/renderer/App.vue \
            src/renderer/components/VirtualScrollNoHeight.vue \
            src/renderer/components/ScrollBar.vue \
            .github/workflows/ci.yml \
            --write

      - name: Check formatting
        run: yarn run format:check

      - name: Lint source
        run: yarn lint

      - name: Type check
        run: yarn run vue:type-check

      - name: Run security and feature regression tests
        run: >-
          yarn playwright test tests/security-hardening.spec.ts tests/feature-regression.spec.ts

      - name: Build renderer and main process
        run: yarn vite --config vite.config.ts build

      - name: Persist virtual list player inset fix
        run: |
          if git diff --quiet -- \
            src/renderer/App.vue \
            src/renderer/components/VirtualScrollNoHeight.vue \
            src/renderer/components/ScrollBar.vue; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/renderer/App.vue \
            src/renderer/components/VirtualScrollNoHeight.vue \
            src/renderer/components/ScrollBar.vue
          git commit -m "fix: reserve player space in virtual lists"
          git push origin HEAD:${{ github.head_ref }}
