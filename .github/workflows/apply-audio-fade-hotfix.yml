name: Apply audio fade hotfix

on:
  push:
    branches:
      - fix/diagnostics-dark-mode-actions

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: fix/diagnostics-dark-mode-actions
          fetch-depth: 0

      - name: Patch audio fade ordering and regression coverage
        shell: python
        run: |
          from pathlib import Path

          player_path = Path('src/renderer/store/player.ts')
          player = player_path.read_text()

          replacements = [
              (
                  """      await smoothGain(0, 0)\n\n      isPersonalFM.value = false\n""",
                  """      isPersonalFM.value = false\n""",
              ),
              (
                  """      await smoothGain(0, 0)\n      return getLocalMusic(trackID as number).then(async (track) => {\n""",
                  """      return getLocalMusic(trackID as number).then(async (track) => {\n""",
              ),
              (
                  """        // 淡入淡出功能需要调整到 masterGain 上，而不是 audio 元素上，以避免出现爆破音\n        const fade = fadeDuration.value\n        await smoothGain(volume.value, fade)\n        await audioNodes.audio.play()\n""",
                  """        // 先让媒体元素以静音增益启动，再对正在播放的音频执行淡入。\n        // 旧实现先等待淡入完成再调用 play()，因此淡入发生在无声阶段，听起来等同于失效。\n        const fade = fadeDuration.value\n        await smoothGain(0, 0)\n        await audioNodes.audio.play()\n        void smoothGain(volume.value, fade)\n""",
              ),
          ]

          for old, new in replacements:
              count = player.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one player replacement, found {count}: {old[:80]!r}')
              player = player.replace(old, new, 1)

          player_path.write_text(player)

          test_path = Path('tests/feature-regression.spec.ts')
          tests = test_path.read_text()
          anchor = """  test('keeps injected settings controls theme-aware and activates custom accent colors', () => {\n    const settings = readSource('src/renderer/views/SystemSettings.vue')\n    const sharedFeatures = readSource('src/renderer/utils/v327FeatureShared.ts')\n\n    expect(settings).toContain('@update:value=\"selectCustomizeColor\"')\n    expect(settings).toContain('const selectCustomizeColor = (value: string) => {')\n    expect(settings).toContain('customizeColor.value.color = value')\n    expect(settings).toContain('changeColor(customizeColor.value)')\n    expect(sharedFeatures).toContain('color: var(--color-text);')\n    expect(sharedFeatures).toContain('background: var(--color-secondary-bg);')\n    expect(sharedFeatures).toContain('.vutronmusic-v327-controls button {')\n  })\n\n"""
          if tests.count(anchor) != 1:
              raise SystemExit('Could not find regression-test insertion anchor')

          addition = """  test('keeps update diagnostics actions readable in dark mode', () => {\n    const latestVersion = readSource('src/renderer/components/LatestVersion.vue')\n\n    expect(latestVersion).toContain('.diagnostic-panel {')\n    expect(latestVersion).toContain('.diagnostic-panel__actions {')\n    expect(latestVersion).toContain('color: var(--color-text);')\n    expect(latestVersion).toContain('font: inherit;')\n  })\n\n  test('applies fade-in only after audio playback has started', () => {\n    const player = readSource('src/renderer/store/player.ts')\n    const replacePlaylist = player.slice(\n      player.indexOf('const replacePlaylist = async'),\n      player.indexOf('const replaceCurrentTrack = async')\n    )\n    const replaceCurrentTrack = player.slice(\n      player.indexOf('const replaceCurrentTrack = async'),\n      player.indexOf('// const _scrobble')\n    )\n    const play = player.slice(\n      player.indexOf('const play = async'),\n      player.indexOf('const pause = async')\n    )\n\n    expect(replacePlaylist).not.toContain('await smoothGain(0, 0)')\n    expect(replaceCurrentTrack).not.toContain('await smoothGain(0, 0)')\n    expect(player).toContain('await smoothGain(0, fade)')\n    expect(play).toContain('await smoothGain(0, 0)')\n    expect(play).toContain('await audioNodes.audio.play()')\n    expect(play).toContain('void smoothGain(volume.value, fade)')\n    expect(play.indexOf('await audioNodes.audio.play()')).toBeLessThan(\n      play.indexOf('void smoothGain(volume.value, fade)')\n    )\n  })\n\n"""
          test_path.write_text(tests.replace(anchor, anchor + addition, 1))

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 600000

      - name: Format patched files
        run: yarn prettier --write src/renderer/store/player.ts src/renderer/components/LatestVersion.vue tests/feature-regression.spec.ts

      - name: Type check
        run: yarn run vue:type-check

      - name: Run feature regression tests
        run: yarn playwright test tests/feature-regression.spec.ts

      - name: Remove one-time workflow and commit result
        run: |
          git rm .github/workflows/apply-audio-fade-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/store/player.ts src/renderer/components/LatestVersion.vue tests/feature-regression.spec.ts
          git commit -m "fix: restore audio fade transitions"
          git push origin HEAD:fix/diagnostics-dark-mode-actions
