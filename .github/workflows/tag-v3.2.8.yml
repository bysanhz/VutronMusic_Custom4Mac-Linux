name: Dispatch v3.2.8 build

on:
  push:
    branches:
      - automation/tag-v3.2.8

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: 34c3c4f0cad29ff0923b249873d224588a91dd4a
      RELEASE_TAG: v3.2.8
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify exact tag
        shell: bash
        run: |
          set -euo pipefail
          TAG_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"
          test "${TAG_SHA}" = "${RELEASE_SHA}"

      - name: Dispatch release workflow
        shell: bash
        run: |
          set -euo pipefail
          EXISTING="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/runs?event=workflow_dispatch&per_page=20" --jq ".workflow_runs[] | select(.head_sha == \"${RELEASE_SHA}\") | .id" | head -n1 || true)"
          if [[ -n "${EXISTING}" ]]; then
            echo "Release workflow already exists: ${EXISTING}"
            exit 0
          fi

          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/dispatches" \
            -f "ref=${RELEASE_TAG}"
