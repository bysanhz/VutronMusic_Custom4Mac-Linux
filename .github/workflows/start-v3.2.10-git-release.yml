name: Start v3.2.10 build with git tag

on:
  pull_request:
    branches:
      - main

permissions:
  actions: write
  contents: write

jobs:
  start:
    if: github.repository == 'bysanhz/VutronMusic_Custom4Mac-Linux' && github.head_ref == 'automation/trigger-v3.2.10-git-release'
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: 632e474a2f978641fc909711f0359c1acdf4300e
      RELEASE_TAG: v3.2.10
      STATUS_BRANCH: automation/v3.2.10-release-status
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify frozen release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git show "${TARGET_SHA}:package.json" | jq -r '.version')" = '3.2.10'
          git cat-file -e "${TARGET_SHA}:.github/release-notes/v3.2.10.md"

      - name: Create exact release tag with git
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_TAG="$(git ls-remote origin "refs/tags/${RELEASE_TAG}" | awk '{print $1}')"
          if [[ -n "${REMOTE_TAG}" ]]; then
            test "${REMOTE_TAG}" = "${TARGET_SHA}"
          else
            git tag "${RELEASE_TAG}" "${TARGET_SHA}"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi
          test "$(git ls-remote origin "refs/tags/${RELEASE_TAG}" | awk '{print $1}')" = "${TARGET_SHA}"

      - name: Dispatch release workflow from tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          STARTED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "STARTED_AT=${STARTED_AT}" >> "$GITHUB_ENV"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/dispatches" -f ref="${RELEASE_TAG}"

      - name: Resolve release workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN=''
          for _ in $(seq 1 90); do
            DATA="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/runs?event=workflow_dispatch&per_page=50")"
            RUN="$(jq -c --arg sha "${TARGET_SHA}" --arg started "${STARTED_AT}" '[.workflow_runs[] | select(.head_sha == $sha and .created_at >= $started)] | sort_by(.created_at) | reverse | .[0] // empty' <<<"${DATA}")"
            [[ -n "${RUN}" ]] && break
            sleep 2
          done
          [[ -n "${RUN}" ]]
          RUN_ID="$(jq -r '.id' <<<"${RUN}")"
          RUN_URL="$(jq -r '.html_url' <<<"${RUN}")"
          printf 'tag=%s\ntarget_sha=%s\nrun_id=%s\nstatus=building\nrun_url=%s\n' \
            "${RELEASE_TAG}" "${TARGET_SHA}" "${RUN_ID}" "${RUN_URL}" > /tmp/release-status.txt

      - name: Publish build snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf /tmp/vutron-v3210-status
          git worktree add -B "${STATUS_BRANCH}" /tmp/vutron-v3210-status "${TARGET_SHA}"
          cp /tmp/release-status.txt /tmp/vutron-v3210-status/.release-v3.2.10-status.txt
          cd /tmp/vutron-v3210-status
          git add .release-v3.2.10-status.txt
          git commit -m 'chore: record v3.2.10 build run'
          git push --force origin "HEAD:refs/heads/${STATUS_BRANCH}"
