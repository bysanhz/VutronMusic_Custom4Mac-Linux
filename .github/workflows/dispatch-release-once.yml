name: Dispatch Release Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/dispatch-release-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing Release workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --repo "${{ github.repository }}" --ref main
