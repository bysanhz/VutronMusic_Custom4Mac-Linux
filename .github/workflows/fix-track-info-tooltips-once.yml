name: Fix track info and tooltips once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'automation/fix-track-info-tooltips'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v6
        with:
          ref: automation/fix-track-info-tooltips
          fetch-depth: 0

      - name: Apply track info and tooltip fixes
        run: python tools/fix-track-info-tooltips-once.py

      - name: Remove one-time helpers before validation
        run: |
          rm -f tools/fix-track-info-tooltips-once.py
          rm -f .github/workflows/fix-track-info-tooltips-once.yml

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies without native rebuild
        run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 600000

      - name: Format changed source
        run: yarn prettier --write src/renderer/components/CommonPlayer.vue src/renderer/views/PlayPage.vue src/renderer/locales/zh-hans.json src/renderer/locales/zh-hant.json src/renderer/locales/en.json tests/feature-regression.spec.ts

      - name: Check formatting
        run: yarn run format:check

      - name: Lint source
        run: yarn lint

      - name: Type check
        run: yarn run vue:type-check

      - name: Run security and feature regression tests
        run: yarn playwright test tests/security-hardening.spec.ts tests/feature-regression.spec.ts

      - name: Build renderer and main process
        run: yarn vite --config vite.config.ts build

      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix: improve Classic track info and player tooltips'
          git push origin HEAD:automation/fix-track-info-tooltips
