name: One-time repair desktop lyric unlock patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-osd-unlock-patch-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Repair formatter command
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/patch-osd-unlock-once.yml')
          text = path.read_text()
          old = 'yarn prettier src/renderer/views/OSDLyric.vue src/preload/osdWin.ts src/renderer/assets/icons/unlock.svg tests/osd-bottom-lock.spec.ts --write'
          new = 'yarn prettier src/renderer/views/OSDLyric.vue src/preload/osdWin.ts tests/osd-bottom-lock.spec.ts --write'
          if old not in text:
              raise SystemExit('expected formatter command not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit repair and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/patch-osd-unlock-once.yml
          git rm .github/workflows/fix-osd-unlock-patch-once.yml
          git commit -m "chore: repair desktop lyric unlock patch formatter"
          git push origin HEAD:main
