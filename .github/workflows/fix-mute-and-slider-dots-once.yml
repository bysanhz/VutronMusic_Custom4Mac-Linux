name: Fix mute and slider dots once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'automation/fix-mute-and-slider-dots'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v6
        with:
          ref: automation/fix-mute-and-slider-dots
          fetch-depth: 0

      - name: Apply mute and slider-dot fix
        run: python tools/fix-mute-and-slider-dots-once.py

      - name: Remove one-time helpers before validation
        run: |
          rm -f tools/fix-mute-and-slider-dots-once.py
          rm -f .github/workflows/fix-mute-and-slider-dots-once.yml

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies without native rebuild
        run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 600000

      - name: Format changed source
        run: yarn prettier --write src/renderer/components/PlayerBar.vue src/renderer/components/VueSlider.vue src/renderer/locales/zh-hans.json src/renderer/locales/zh-hant.json src/renderer/locales/en.json tests/feature-regression.spec.ts

      - name: Check formatting
        run: yarn run format:check

      - name: Lint source
        run: yarn lint

      - name: Type check
        run: yarn run vue:type-check

      - name: Run security and feature regression tests
        run: yarn playwright test tests/security-hardening.spec.ts tests/feature-regression.spec.ts

      - name: Build renderer and main process
        run: yarn vite --config vite.config.ts build

      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix: add mute toggle and slider position dots'
          git push origin HEAD:automation/fix-mute-and-slider-dots
