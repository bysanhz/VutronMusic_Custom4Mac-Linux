name: Dispatch v3.2.7 release

on:
  push:
    branches:
      - automation/v327-hardening-result-v2
    paths:
      - '.github/workflows/dispatch-v3.2.7.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch release workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref main

