name: Debug global audit fix

on:
  push:
    paths:
      - '.github/workflows/debug-global-audit-fix.yml'

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract reviewed fix script
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/global-audit-fix.yml').read_text(encoding='utf-8')
          start_marker = "python3 <<'PY'\n"
          end_marker = "\n          PY\n"
          yaml_indent = '          '

          start = source.find(start_marker)
          if start < 0:
              raise SystemExit('未找到修复脚本起始标记')
          start += len(start_marker)
          end = source.find(end_marker, start)
          if end < 0:
              raise SystemExit('未找到修复脚本结束标记')

          lines = source[start:end].splitlines()
          script = '\n'.join(
              line[len(yaml_indent):] if line.startswith(yaml_indent) else line
              for line in lines
          ) + '\n'
          compile(script, '/tmp/apply_global_audit_fixes.py', 'exec')
          Path('/tmp/apply_global_audit_fixes.py').write_text(script, encoding='utf-8')
          PY

      - name: Capture apply error
        id: apply
        continue-on-error: true
        run: |
          set -o pipefail
          python3 /tmp/apply_global_audit_fixes.py 2>&1 | tee /tmp/audit-fix-error.log

      - name: Commit captured error
        if: steps.apply.outcome == 'failure'
        run: |
          cp /tmp/audit-fix-error.log audit-fix-error.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit-fix-error.log
          git commit -m "记录全局审查修复错误"
          git push origin HEAD:main

      - name: Fail after capture
        if: steps.apply.outcome == 'failure'
        run: exit 1

# 第二次提交用于触发已存在于默认分支的调试工作流。
