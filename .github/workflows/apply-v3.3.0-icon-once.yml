name: One-time v3.3.0 icon apply

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-v3.3.0-icon-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 600000

      - name: Rebuild approved app icon
        shell: bash
        run: |
          set -euo pipefail
          cat .github/icon-upload-v330/chunk*.b64 | base64 -d -i > /tmp/vutron-icon.webp
          echo '724e045dca4a5e74e5832b602d79caa478c8add1b1b80860c167887390a9e792  /tmp/vutron-icon.webp' | sha256sum -c -

          node - <<'NODE'
          const sharp = require('sharp')

          ;(async () => {
            const input = sharp('/tmp/vutron-icon.webp')
            const meta = await input.metadata()
            if (meta.width !== 512 || meta.height !== 512) {
              throw new Error(`unexpected source icon size ${meta.width}x${meta.height}`)
            }

            await input.png().toFile('new_icon.next.png')

            const out = await sharp('new_icon.next.png').metadata()
            if (out.width !== 512 || out.height !== 512 || out.format !== 'png') {
              throw new Error(
                `unexpected PNG output ${out.width}x${out.height} ${out.format}`
              )
            }
          })().catch((error) => {
            console.error(error)
            process.exit(1)
          })
          NODE

          mv new_icon.next.png new_icon.png

      - name: Validate generated platform icons
        shell: bash
        run: |
          set -euo pipefail
          node tools/generate-app-icons.js

          node - <<'NODE'
          const sharp = require('sharp')

          ;(async () => {
            const common = await sharp('buildAssets/generated-icons/1024x1024.png').metadata()
            if (common.width !== 1024 || common.height !== 1024) {
              throw new Error(
                `generated common icon mismatch ${common.width}x${common.height}`
              )
            }

            const linux = await sharp('buildAssets/generated-icons/linux/512x512.png').metadata()
            if (linux.width !== 512 || linux.height !== 512) {
              throw new Error(
                `generated Linux icon mismatch ${linux.width}x${linux.height}`
              )
            }

            const tray = await sharp('buildAssets/generated-icons/tray/24x24.png').metadata()
            if (tray.width !== 24 || tray.height !== 24) {
              throw new Error(
                `generated tray icon mismatch ${tray.width}x${tray.height}`
              )
            }
          })().catch((error) => {
            console.error(error)
            process.exit(1)
          })
          NODE

      - name: Commit icon and cleanup staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add new_icon.png
          git rm -r .github/icon-upload-v330

          if [ -d .github/icon-upload ]; then
            git rm -r .github/icon-upload
          fi

          git rm .github/workflows/apply-v3.3.0-icon-once.yml
          git commit -m "build: replace app icon for v3.3.0"
          git push origin HEAD:main
